[project]
name = "qs-oura-importer"
version = "0.1.0"
description = "Oura Ring Importer for Quantified Self"
dependencies = [
    "nats-py>=2.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "apscheduler>=3.10.0"
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oura_importer"]
