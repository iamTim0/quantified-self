[project]
name = "yazio-importer"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Quantified Self Yazio Importer Microservice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "nats-py>=2.9.0",
    "pydantic-settings>=2.2.1",
    "qs-shared-schemas",
]

# The metric catalog is shared, not copied: a name or unit defined in
# packages/shared-schemas/src/shared_schemas/metrics.py reaches this importer here.
[tool.uv.sources]
qs-shared-schemas = { path = "../../../packages/shared-schemas", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yazio_importer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
