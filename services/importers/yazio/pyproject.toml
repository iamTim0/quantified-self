[project]
name = "yazio-importer"
version = "0.1.0"
license = "MIT"
description = "Quantified Self Yazio Importer Microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "nats-py>=2.9.0",
    "pydantic-settings>=2.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yazio_importer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
