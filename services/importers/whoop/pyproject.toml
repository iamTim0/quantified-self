[project]
name = "whoop-importer"
version = "0.1.0"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "nats-py>=2.8", "pydantic-settings>=2.2", "uvicorn>=0.30", "qs-shared-schemas"]

# The metric catalog is shared, not copied: a name or unit defined in
# packages/shared-schemas/src/shared_schemas/metrics.py reaches this importer here.
[tool.uv.sources]
qs-shared-schemas = { path = "../../../packages/shared-schemas", editable = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whoop_importer"]
