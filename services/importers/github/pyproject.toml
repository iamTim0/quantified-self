[project]
name="github-importer"
version="0.1.0"
license = "AGPL-3.0-only"
requires-python=">=3.12"
dependencies=["httpx>=0.27","nats-py>=2.8","pydantic-settings>=2.2","pytest>=8","pytest-asyncio>=0.24","qs-shared-schemas"]
# No GitHub SDK. Two GraphQL documents and one POST is the whole client, and a
# dependency that wraps `httpx` to send them would be more code to keep current than
# the queries themselves.
# The metric catalog is shared, not copied: a name or unit defined in
# packages/shared-schemas/src/shared_schemas/metrics.py reaches this importer here.
[tool.uv.sources]
qs-shared-schemas = { path = "../../../packages/shared-schemas", editable = true }
[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[tool.hatch.build.targets.wheel]
packages=["src/github_importer"]
