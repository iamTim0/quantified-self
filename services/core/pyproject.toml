[project]
name = "qs-core-service"
version = "0.1.0"
description = "Core Data Service for Quantified Self"
authors = [{name = "Author"}]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "nats-py>=2.7.0",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pgvector>=0.2.5",
    "alembic>=1.13.0"
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
