[project]
name = "qs-core-service"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Core Data Service for Quantified Self"
authors = [{name = "Author"}]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "nats-py>=2.7.0",
    "grpcio>=1.62.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pgvector>=0.2.5",
    "geoalchemy2>=0.14.0",
    "alembic>=1.13.0",
    "passlib>=1.7.4",
    "bcrypt<4.0.0",
    "pyjwt>=2.13.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "qs-proto",
    "qs-shared-schemas",
]
requires-python = ">=3.12"

# Neither psycopg nor grpcio-tools is here. Every connection this service opens is
# asyncpg's -- the application through DATABASE_URL in core/config.py and Alembic
# through alembic.ini name the same `postgresql+asyncpg` driver -- and grpcio-tools
# is the code generator behind `task proto:generate`, which supplies it itself with
# `uv run --with`. The Dockerfile copies packages/proto/gen and never runs protoc.
# Both were declared here, imported nowhere, and shipped into the runtime image.

# Path dependencies rather than copies: a protobuf change reaches this service
# through packages/proto/generate.py (AGENTS.md rule 7), and a metric definition
# through packages/shared-schemas/src/shared_schemas/metrics.py.
[tool.uv.sources]
qs-proto = { path = "../../packages/proto", editable = true }
qs-shared-schemas = { path = "../../packages/shared-schemas", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
