# Quantified Self Platform — Coolify production stack.
#
# This file intentionally differs from docker-compose.prod.yml:
#
#   * Coolify supplies the reverse proxy and the application network.
#   * There is no embedded Traefik or cloudflared service.
#   * There are no custom networks and no host port mappings.
#   * The public routes use Coolify's Traefik labels and one hostname.
#
# Deploy this file from the repository root with Coolify's Docker Compose build
# pack. Keep service names and internal URLs unchanged: Docker DNS on Coolify's
# managed network resolves postgres, nats, core, analysis, and the importers by
# these names.

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qs_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-quantified_self}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qs_dev} -d ${POSTGRES_DB:-quantified_self}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    restart: always
    command: --jetstream --store_dir /data
    volumes:
      - natsdata:/data

  core:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/core:${QS_VERSION:?set QS_VERSION}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-qs_dev}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quantified_self}
      - NATS_URL=nats://nats:4222
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - POST_LOGOUT_REDIRECT_URI=https://${PUBLIC_HOST:?set PUBLIC_HOST}/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  analysis:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/analysis:${QS_VERSION:?set QS_VERSION}
    restart: always
    depends_on:
      core:
        condition: service_healthy
    environment:
      - CORE_GRPC_URL=core:50051
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET}

  api-gateway:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/api-gateway:${QS_VERSION:?set QS_VERSION}
    restart: always
    depends_on:
      core:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - STREAK_IMPORTER_URL=http://streak-importer:8006
      - APPLE_HEALTH_IMPORTER_URL=http://apple-health-importer:8005
      - WHOOP_IMPORTER_URL=http://whoop-importer:8007
      - DASHBOARD_URL=http://dashboard:3000
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS; use https://your-host.example}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      # Used by the labels below and deliberately required at compose parsing time.
      - PUBLIC_HOST=${PUBLIC_HOST:?set PUBLIC_HOST}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qs-coolify-api.rule=Host(`${PUBLIC_HOST}`) && (PathPrefix(`/api`) || Path(`/health`))"
      - "traefik.http.routers.qs-coolify-api.entrypoints=http"
      - "traefik.http.routers.qs-coolify-api.priority=10"
      - "traefik.http.services.qs-coolify-api.loadbalancer.server.port=8000"

  dashboard:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/dashboard:${QS_VERSION:?set QS_VERSION}
    restart: always
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qs-coolify-workspace.rule=Host(`${PUBLIC_HOST}`) && PathPrefix(`/`)"
      - "traefik.http.routers.qs-coolify-workspace.entrypoints=http"
      - "traefik.http.routers.qs-coolify-workspace.priority=1"
      - "traefik.http.services.qs-coolify-workspace.loadbalancer.server.port=3000"

  docs:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/docs:${QS_VERSION:?set QS_VERSION}
    restart: always
    expose:
      - "8003"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qs-coolify-docs.rule=Host(`${PUBLIC_HOST}`) && PathPrefix(`/docs`)"
      - "traefik.http.routers.qs-coolify-docs.entrypoints=http"
      - "traefik.http.routers.qs-coolify-docs.priority=20"
      - "traefik.http.services.qs-coolify-docs.loadbalancer.server.port=8003"
      - "traefik.http.middlewares.qs-coolify-docs-stripprefix.stripprefix.prefixes=/docs"
      - "traefik.http.routers.qs-coolify-docs.middlewares=qs-coolify-docs-stripprefix"

  yazio-importer:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/importer-yazio:${QS_VERSION:?set QS_VERSION}
    restart: always
    depends_on:
      core:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET}

  dawarich-importer:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/importer-dawarich:${QS_VERSION:?set QS_VERSION}
    restart: always
    depends_on:
      core:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET}

  whoop-importer:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/importer-whoop:${QS_VERSION:?set QS_VERSION}
    restart: always
    depends_on:
      core:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET}
      - PORT=8007

  apple-health-importer:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/importer-apple-health:${QS_VERSION:?set QS_VERSION}
    restart: always
    depends_on:
      core:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET}
      - PORT=8005

  streak-importer:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/importer-streak:${QS_VERSION:?set QS_VERSION}
    restart: always
    depends_on:
      core:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET}
      - PORT=8006
    expose:
      - "8006"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qs-coolify-ingest.rule=Host(`${PUBLIC_HOST}`) && PathPrefix(`/ingest`)"
      - "traefik.http.routers.qs-coolify-ingest.entrypoints=http"
      - "traefik.http.routers.qs-coolify-ingest.priority=30"
      - "traefik.http.services.qs-coolify-ingest.loadbalancer.server.port=8006"

  home-assistant-importer:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/importer-home-assistant:${QS_VERSION:?set QS_VERSION}
    restart: always
    depends_on:
      core:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET}

  weather-importer:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/importer-weather:${QS_VERSION:?set QS_VERSION}
    restart: always
    depends_on:
      core:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET}

  calendar-importer:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/importer-calendar:${QS_VERSION:?set QS_VERSION}
    restart: always
    depends_on:
      core:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET}

volumes:
  pgdata:
  natsdata:
