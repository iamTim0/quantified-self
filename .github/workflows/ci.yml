name: CI

# There was no CI in this repository at all: lint, tests and the docs build were
# manual-only, so nothing enforced them. This runs the gates that already exist.

on:
  push:
    # `dev` as well as `main`, because `dev` is where the work actually lands and
    # `main` only ever receives it already merged. With `main` alone, 25 commits
    # accumulated over one night with nothing run against them, and the run that
    # finally checked them happened because somebody asked for it by hand. A gate
    # that only guards the branch after the merge reports problems too late to be
    # cheap to fix.
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  lint-python:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff
        # Not --exit-non-zero-on-fix; this reports the existing findings without
        # failing the build on the pre-existing backlog. Tighten once it is clear.
        run: uv run --with ruff ruff check services/ specs/ --output-format github
        continue-on-error: true

  test-core:
    name: Core + Gateway
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: qs_dev
          POSTGRES_PASSWORD: qs_dev_password
          POSTGRES_DB: quantified_self
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U qs_dev -d quantified_self"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Start NATS with JetStream
        # Not a `services:` container: that syntax cannot pass a command to the
        # image, and the NATS server only enables JetStream when started with
        # `-js`. Without it `add_stream` fails and every publish raises
        # NoStreamResponseError, which is what broke the ingestion test.
        run: |
          docker run -d --name qs-nats -p 4222:4222 -p 8222:8222 nats:2-alpine -js -m 8222
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz > /dev/null; then
              echo "NATS healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "NATS did not become healthy" >&2
          docker logs qs-nats >&2
          exit 1

      - name: Apply migrations
        run: uv run --directory services/core alembic upgrade head

      - name: Verify migration rollback
        # AGENTS.md rule 7 requires a working downgrade; assert it rather than trust it.
        run: |
          uv run --directory services/core alembic downgrade -1
          uv run --directory services/core alembic upgrade head

      - name: Core tests
        run: uv run --directory services/core --with pytest --with pytest-asyncio pytest tests -q

      - name: Gateway tests
        run: uv run --directory services/api-gateway --with pytest --with pytest-asyncio pytest tests -q

      - name: Spec invariant tests
        run: |
          python .agents/scripts/check_invariant_tests.py
          uv run --with pytest --with cryptography --directory specs pytest tests -q

      - name: End-to-end tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          uv run --directory services/core
          --with pytest --with pytest-asyncio --with nats-py
          --with icalendar --with recurring-ical-events
          pytest ${{ github.workspace }}/tests/e2e -q --rootdir ${{ github.workspace }}

  test-analysis:
    name: Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # No database service on purpose. This suite includes a boundary test that
      # asserts the service imports no database driver; giving the job a database
      # would make a violation harder to notice, not easier.
      - name: Analysis tests
        run: >-
          uv run --directory services/analysis
          --with pytest --with pytest-asyncio --with httpx
          pytest tests -q

  browser:
    name: Browser (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: qs_dev
          POSTGRES_PASSWORD: qs_dev_password
          POSTGRES_DB: quantified_self
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U qs_dev -d quantified_self"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Bun, not Node. The dashboard had two lockfiles that disagreed -- CI
      # installed with `npm ci` from package-lock.json while the Dockerfile
      # installed with pnpm from a pnpm-lock.yaml that had gone stale, so the
      # image was unbuildable and CI could not notice. One lockfile now, bun.lock,
      # and the same tool reads it here and in the image.
      - uses: oven-sh/setup-bun@v2
        with:
          # Matches the `oven/bun:1-alpine` the image is built on.
          bun-version: "1.x"

      - name: Apply migrations
        run: uv run --directory services/core alembic upgrade head

      - run: bun install --frozen-lockfile
        working-directory: apps/dashboard

      # A production build, not `next dev`. The Gateway proxies the UI by
      # buffering each response, and Turbopack's dev streaming does not survive
      # that -- the page arrives but never hydrates. `next start` is also what
      # actually gets deployed, so it is the right thing to test.
      - name: Build dashboard
        run: bun run build
        working-directory: apps/dashboard
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Cached, because it is the one step here that downloads ~150 MB from a
      # third-party CDN on every single run. Twice it stalled long enough to eat
      # the job's whole 20-minute budget -- reported as "cancelled", with every
      # other job green, which reads like an infrastructure mystery rather than a
      # slow download. The key carries the resolved Playwright version, so a
      # dependency bump invalidates it instead of restoring a browser the new
      # client refuses to drive.
      - name: Playwright version
        id: pw
        working-directory: apps/dashboard
        run: echo "version=$(bunx playwright --version | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # The hosted Ubuntu image already carries Chromium's shared-library runtime.
      # `--with-deps` still ran `apt update` on every job merely to add optional font
      # packages, and the Azure Ubuntu mirror repeatedly stopped responding there --
      # before a browser test had started and despite a warm browser cache. Install
      # only the versioned browser artifacts here; the cache can now make this step
      # independent of apt altogether. Keep the timeout so a stalled browser CDN is
      # still named at the step that owns it rather than consuming the test budget.
      - name: Install Chromium
        timeout-minutes: 6
        run: bunx playwright install chromium
        working-directory: apps/dashboard

      - name: Start the stack
        run: |
          set -euo pipefail

          # Every wait is bounded. An unbounded `until curl` loop turns a service
          # that failed to start into a job that hangs until its 20-minute
          # timeout, with no indication of which service or why -- which is
          # exactly what happened the first time this ran.
          wait_for() {
            local name=$1 url=$2 log=$3
            for _ in $(seq 1 60); do
              if curl -sf "$url" > /dev/null; then
                echo "$name is up"
                return 0
              fi
              sleep 1
            done
            echo "::error::$name did not come up within 60s ($url)"
            echo "--- $log ---"
            cat "$log" || true
            return 1
          }

          # SCHEDULER_ENABLED=false: a background tick firing mid-test would add
          # SyncRun rows the assertions do not expect.
          #
          # ENVIRONMENT=dev because Core and the Gateway refuse to start on the
          # repository's default secrets in a production environment, and the
          # Gateway defaults ENVIRONMENT to production (it is the edge; strict is
          # the right default there). CI is not production, and there is no .env
          # on the runner.
          #
          # ALLOW_REGISTRATION: off by default now, and the browser tests create
          # their own accounts through the signup endpoint, because rule 10 says
          # a test may not assume a pre-existing one.
          ENVIRONMENT=dev SCHEDULER_ENABLED=false ALLOW_REGISTRATION=true \
            uv run --directory services/core \
            uvicorn core.main:app --host 127.0.0.1 --port 8001 --log-level warning \
            > /tmp/core.log 2>&1 &

          # `next start` takes the directory positionally; there is no --dir flag,
          # and passing one made it exit immediately.
          ( cd apps/dashboard && bunx next start --port 3000 > /tmp/next.log 2>&1 & )

          wait_for "Core" http://127.0.0.1:8001/health /tmp/core.log
          wait_for "Next" http://127.0.0.1:3000 /tmp/next.log

          # The Gateway last: it proxies both of the above.
          # The Gateway refuses /auth/signup on its own, independently of Core.
          ENVIRONMENT=dev ALLOW_REGISTRATION=true \
          CORE_SERVICE_URL=http://127.0.0.1:8001 \
          DASHBOARD_URL=http://127.0.0.1:3000 \
          uv run --directory services/api-gateway \
            uvicorn gateway.main:app --host 127.0.0.1 --port 8000 --log-level warning \
            > /tmp/gateway.log 2>&1 &

          # /health aggregates the production topology; this lightweight CI
          # process intentionally does not start every importer and docs image.
          wait_for "Gateway" http://127.0.0.1:8000/healthz /tmp/gateway.log

          # The UI must be reachable *through* the Gateway, not just directly.
          # That is the origin the tests use, and the proxy is the part most
          # likely to be misconfigured.
          wait_for "Dashboard via Gateway" http://127.0.0.1:8000/ /tmp/gateway.log

      - name: Service logs
        if: failure()
        run: |
          for f in /tmp/core.log /tmp/gateway.log /tmp/next.log; do
            echo "===== $f ====="
            tail -50 "$f" || true
          done

      - name: Browser tests
        run: bunx playwright test
        working-directory: apps/dashboard

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/dashboard/playwright-report/
            apps/dashboard/test-results/
          retention-days: 7

  lint-specs:
    name: Spec lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Structural check only -- it explores no state space and proves nothing
      # about the invariants. It runs here because it takes seconds and needs no
      # download, and it catches the mistakes that made the specs unrunnable in
      # the first place. The actual model check lives in specs.yml, which runs
      # when a spec changes rather than on every push; see the comment there for
      # why that split.
      - name: Lint specifications
        run: python .agents/scripts/lint_specs.py

      - name: Reject vacuous invariant tests
        run: python .agents/scripts/check_invariant_tests.py

      # AGENTS.md rule 14. Seconds to run, and the only moment it can still
      # help: once a personal address, a deployment hostname or a password hash
      # is committed, no later commit takes it out of the history.
      - name: Check for personal information
        run: python .agents/scripts/check_private_info.py

      # The release workflow builds exactly the images in tools/build_images.py.
      # A Dockerfile that is in neither list there is one that never gets
      # published, and nothing fails when a build simply does not happen -- so it
      # is checked here, on every push, rather than discovered at release time.
      - name: Image manifest complete
        run: python tools/build_images.py --check

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # tools/ had tests but no job running them.
      - name: Tool tests
        run: uv run --with pytest pytest tools/tests -q

      # packages/shared-schemas had the same gap: every service depends on this
      # package, `task test:packages` runs its suite locally, and nothing ran it
      # here -- so the metric registry and the upload spool were covered only on
      # whichever machine happened to type the task name.
      - name: Shared package tests
        run: >-
          uv run --directory packages/shared-schemas
          --with pytest --with pytest-asyncio pytest tests -q

      - name: Validate importer contracts
        run: python tools/importer_contracts.py

      - name: Importer contract catalog current
        run: python tools/generate_importer_contracts.py --check

  importer-list:
    name: Importer list
    runs-on: ubuntu-latest
    outputs:
      importers: ${{ steps.list.outputs.importers }}
    steps:
      - uses: actions/checkout@v4
      # Discovered, not written out. This list was eight names by hand, and
      # `task test:importers` globs the directory -- so a ninth importer was
      # tested locally and silently never in CI. One source now answers both.
      - id: list
        run: |
          importers=$(python tools/build_images.py --importers)
          echo "importers=$importers" >> "$GITHUB_OUTPUT"
          echo "$importers"

  test-importers:
    name: Importers
    runs-on: ubuntu-latest
    needs: importer-list
    strategy:
      fail-fast: false
      matrix:
        importer: ${{ fromJSON(needs.importer-list.outputs.importers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Test ${{ matrix.importer }}
        run: >-
          uv run --directory services/importers/${{ matrix.importer }}
          --with pytest --with pytest-asyncio pytest tests -q

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"
      # --frozen-lockfile is the point of this step, not a detail: it is what makes
      # a lockfile that no longer matches package.json a failed build here rather
      # than an unbuildable image discovered at release time.
      - run: bun install --frozen-lockfile
      # The image ships THIRD-PARTY-NOTICES.txt to satisfy the MIT/BSD/ISC
      # requirement that a copyright notice accompanies a copy. A dependency change
      # that does not regenerate it makes that file a false statement, so the drift
      # is a build failure rather than something to notice later.
      - name: Third-party notices current
        run: bun run notices --check
      - name: Type check
        run: bun run tsc --noEmit
      # Advisory, as the ESLint step it replaces was: the tree carries findings
      # that predate the switch, so a blocking step would fail every build until
      # they are cleared rather than when someone adds a new one.
      - name: Lint
        run: bun run lint
        continue-on-error: true
      - name: Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # Blocking, unlike the lint step above, and it can be: the allowlist beside
      # the script was seeded with every violation that existed when it was
      # written, so this fails only on a *new* raw palette utility, pixel font
      # size or hex literal. That is the whole point of a ratchet -- a gate that
      # fails on the tree as it stands gets switched off instead of satisfied.
      - name: Design tokens
        run: python .agents/scripts/check_design_tokens.py
        working-directory: ${{ github.workspace }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build site (strict)
        # --strict turns MkDocs' own warnings, including unresolved internal
        # links, into build failures.
        run: uv run --with mkdocs --with mkdocs-material mkdocs build --strict

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir is required for lychee to resolve root-relative links at
          # all; without it they are a hard error, and `--exclude '^/'` never
          # applies because exclusion runs on a resolved URI.
          #
          # /legal/* are Next.js routes served by the dashboard, a different
          # service to this MkDocs site. They are correct root-relative links in
          # the deployed stack (docs live under /docs on the same host) but have
          # no file on disk, so they are excluded after resolution.
          #
          # example.com is excluded because it is the placeholder that replaced a
          # real deployment hostname. No deployment host appears in this
          # repository any more: it comes from PUBLIC_HOST at deploy time, so
          # publishing the repository does not publish where it runs.
          #
          # These three DOI resolver pages return 403 specifically to Lychee's
          # automated client while remaining valid persistent identifiers. Keep
          # the citations and exclude only the blocked identifiers, not DOI links
          # as a class.
          args: >-
            --no-progress --max-concurrency 4
            --root-dir ${{ github.workspace }}
            --exclude-path site/
            --exclude '^https?://localhost'
            --exclude '^https?://127\.0\.0\.1'
            --exclude '^https?://example\.com'
            --exclude '^https?://platform\.openai\.com'
            --exclude '^https://doi\.org/(10\.1098/rspl\.1895\.0041|10\.1111/j\.2517-6161\.1995\.tb02031\.x|10\.1139/f98-104)$'
            --exclude 'file://.*/legal/'
            'docs/**/*.md' 'README.md'
          fail: true

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 7
