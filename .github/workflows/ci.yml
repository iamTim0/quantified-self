name: CI

# There was no CI in this repository at all: lint, tests and the docs build were
# manual-only, so nothing enforced them. This runs the gates that already exist.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  lint-python:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff
        # Not --exit-non-zero-on-fix; this reports the existing findings without
        # failing the build on the pre-existing backlog. Tighten once it is clear.
        run: uv run --with ruff ruff check services/ specs/ --output-format github
        continue-on-error: true

  test-core:
    name: Core + Gateway
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: qs_dev
          POSTGRES_PASSWORD: qs_dev_password
          POSTGRES_DB: quantified_self
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U qs_dev -d quantified_self"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Start NATS with JetStream
        # Not a `services:` container: that syntax cannot pass a command to the
        # image, and the NATS server only enables JetStream when started with
        # `-js`. Without it `add_stream` fails and every publish raises
        # NoStreamResponseError, which is what broke the ingestion test.
        run: |
          docker run -d --name qs-nats -p 4222:4222 -p 8222:8222 nats:2-alpine -js -m 8222
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz > /dev/null; then
              echo "NATS healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "NATS did not become healthy" >&2
          docker logs qs-nats >&2
          exit 1

      - name: Apply migrations
        run: uv run --directory services/core alembic upgrade head

      - name: Verify migration rollback
        # AGENTS.md rule 7 requires a working downgrade; assert it rather than trust it.
        run: |
          uv run --directory services/core alembic downgrade -1
          uv run --directory services/core alembic upgrade head

      - name: Core tests
        run: uv run --directory services/core --with pytest --with pytest-asyncio pytest tests -q

      - name: Gateway tests
        run: uv run --directory services/api-gateway --with pytest --with pytest-asyncio pytest tests -q

      - name: Spec invariant tests
        run: |
          uv run --with pytest --with cryptography --directory specs pytest tests -q

      - name: End-to-end tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          uv run --directory services/core
          --with pytest --with pytest-asyncio --with nats-py
          --with icalendar --with recurring-ical-events
          pytest ${{ github.workspace }}/tests/e2e -q --rootdir ${{ github.workspace }}

  lint-specs:
    name: Spec lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Structural check only -- it explores no state space and proves nothing
      # about the invariants. It runs here because it takes seconds and needs no
      # download, and it catches the mistakes that made the specs unrunnable in
      # the first place. The actual model check lives in specs.yml, which runs
      # when a spec changes rather than on every push; see the comment there for
      # why that split.
      - name: Lint specifications
        run: python .agents/scripts/lint_specs.py

  test-importers:
    name: Importers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        importer:
          [apple_health, calendar, dawarich, home_assistant, streak, weather, whoop, yazio]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Test ${{ matrix.importer }}
        run: >-
          uv run --directory services/importers/${{ matrix.importer }}
          --with pytest --with pytest-asyncio pytest tests -q

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src
        continue-on-error: true
      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build site (strict)
        # --strict turns MkDocs' own warnings, including unresolved internal
        # links, into build failures.
        run: uv run --with mkdocs --with mkdocs-material mkdocs build --strict

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir is required for lychee to resolve root-relative links at
          # all; without it they are a hard error, and `--exclude '^/'` never
          # applies because exclusion runs on a resolved URI.
          #
          # /legal/* are Next.js routes served by the dashboard, a different
          # service to this MkDocs site. They are correct root-relative links in
          # the deployed stack (docs live under /docs on the same host) but have
          # no file on disk, so they are excluded after resolution.
          #
          # The deployment host is excluded because a link checker on every push
          # should not fail when the environment happens to be down -- that is
          # what uptime monitoring is for. It returned 530 (Cloudflare: origin
          # unreachable) on the run that prompted this change.
          args: >-
            --no-progress --max-concurrency 4
            --root-dir ${{ github.workspace }}
            --exclude-path site/
            --exclude '^https?://localhost'
            --exclude '^https?://127\.0\.0\.1'
            --exclude 'quantified-self\.hoffschroeer\.dev'
            --exclude 'file://.*/legal/'
            'docs/**/*.md' 'README.md'
          fail: true

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 7
