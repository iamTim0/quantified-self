name: Release

# Builds every service image, pushes them to the GitHub Container Registry and
# cuts a GitHub Release with a ready-to-deploy bundle attached.
#
# Manual only, on purpose. `workflow_dispatch` has no `push:` or `schedule:`
# trigger beside it, so nothing here can start by itself -- not a merge, not a
# tag, not a nightly. Publishing an image that a deployment will pull, and moving
# `latest` while doing it, is a decision, and it stays one.
#
# The intended path is: merge to main, wait for CI, then run this workflow from
# main with a version number. `guard` refuses to publish a commit whose CI is not
# green, so "I forgot to check" is not a failure mode. See docs/deployment.md.
#
# Requires no secrets: GITHUB_TOKEN can write packages and releases in this
# repository. The one manual step is making the packages public the first time --
# GHCR packages start private even in a public repository, and a private package
# means `docker compose pull` fails with `denied` for everyone but you.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without a leading v (e.g. 1.0.0 or 1.1.0-rc.1)"
        required: true
        type: string
      platforms:
        description: "Target architectures. arm64 is emulated and roughly triples the run."
        required: true
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
      tag_latest:
        description: "Also move :latest to these images"
        required: false
        default: true
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as a pre-release (never moves :latest)"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Build everything, push nothing, create no release"
        required: false
        default: false
        type: boolean
      allow_failed_ci:
        description: "Publish even though CI is not green for this commit"
        required: false
        default: false
        type: boolean

# No blanket grant: each job asks for what it needs. The build job can write
# packages but not releases; the release job can write releases but not packages.
permissions: {}

concurrency:
  # Not cancel-in-progress. Cancelling half way through leaves some of the
# fourteen images pushed under the new tag and the rest not, which is a worse
  # state than a queued second run.
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      minor: ${{ steps.version.outputs.minor }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      registry: ${{ steps.registry.outputs.prefix }}
      push: ${{ steps.registry.outputs.push }}
      matrix: ${{ steps.matrix.outputs.include }}
      image_count: ${{ steps.matrix.outputs.count }}
      default_branch: ${{ steps.registry.outputs.default_branch }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate the version
        id: version
        env:
          RAW_VERSION: ${{ inputs.version }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          # Accept `1.2.3` and `v1.2.3` and normalise; a stray v produced image
          # tags like `vv1.2.3` when it slipped through.
          version="${RAW_VERSION#v}"

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RAW_VERSION' is not a semantic version. Expected 1.2.3 or 1.2.3-rc.1."
            exit 1
          fi

          # Strip any pre-release suffix before taking the minor: `${version%.*}`
          # alone turned 1.2.3-rc.1 into "1.2.3-rc". Unused today, because a
          # suffix forces prerelease and prereleases get no minor tag — but a
          # wrong value sitting in an output is a trap for whoever uses it next.
          minor="${version%%-*}"
          minor="${minor%.*}"

          # A pre-release is a pre-release whether or not the box was ticked. A
          # `-rc.1` build that moves :latest is the single most damaging mistake
          # this workflow could make, so the version string decides too.
          prerelease="$PRERELEASE_INPUT"
          if [[ "$version" == *-* ]]; then
            prerelease=true
            echo "::notice::$version carries a pre-release suffix, so it is marked as a pre-release and will not move :latest."
          fi

          {
            echo "version=$version"
            echo "tag=v$version"
            echo "minor=$minor"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse a version that already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -uo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::${TAG} already has a release. Pick the next version."
            exit 1
          fi
          echo "${TAG} is free."

      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_FAILED: ${{ inputs.allow_failed_ci }}
        run: |
          set -uo pipefail

          # The CI workflow that ran for exactly this SHA, not "the last run on
          # main" -- those differ the moment two commits land close together.
          conclusion=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "none"')

          echo "CI for ${GITHUB_SHA} (${GITHUB_REF_NAME}): ${conclusion}"

          if [ "$conclusion" = "success" ]; then
            exit 0
          fi

          if [ "$ALLOW_FAILED" = "true" ]; then
            echo "::warning::CI is '${conclusion}' for this commit and allow_failed_ci was set. Publishing anyway."
            exit 0
          fi

          if [ "$conclusion" = "none" ]; then
            echo "::error::No completed CI run for ${GITHUB_SHA}. Wait for CI, or re-run with allow_failed_ci."
          else
            echo "::error::CI concluded '${conclusion}' for ${GITHUB_SHA}. Fix it, or re-run with allow_failed_ci."
          fi
          exit 1

      - name: Resolve the image list
        id: matrix
        run: |
          set -euo pipefail

          # The manifest in tools/build_images.py is the single source of truth,
          # so `task images:build` and this workflow cannot disagree about which
          # images exist. --check fails if a Dockerfile in the repository is in
          # neither the published list nor the explicitly-unpublished one, which
          # is how a new importer would otherwise be quietly left unreleased.
          python tools/build_images.py --check

          # Assigned first, then echoed. `echo "x=$(cmd)"` hides a failing cmd
          # completely: echo's own exit status is 0, so `set -e` sees success and
          # the job carries on publishing an empty output -- which then fails
          # `fromJSON('')` over in the build job with "Unexpected end of JSON
          # input", pointing at a line that is not the problem.
          include=$(python tools/build_images.py --matrix)
          count=$(printf '%s' "$include" | jq 'length')
          {
            echo "include=$include"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve the registry and the ref
        id: registry
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Lowercased because GHCR rejects uppercase in a repository path, and
          # $GITHUB_REPOSITORY preserves whatever case the owner and repo have.
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

          if [ "$DRY_RUN" = "true" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry run: images will be built and thrown away."
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

          # Whether this was dispatched from the default branch. Only that branch
          # may move `latest` and the minor tag: those point deployments at code,
          # and a run from an unmerged branch with its own green CI could otherwise
          # aim them at something that is not in main.
          default=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          if [ "$GITHUB_REF_NAME" = "$default" ]; then
            echo "default_branch=true" >> "$GITHUB_OUTPUT"
          else
            echo "default_branch=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dispatched from '${GITHUB_REF_NAME}', not '${default}'. The version and sha- tags will be published; latest and the minor tag will not move."
          fi

  build:
    name: ${{ matrix.image }}
    needs: guard
    runs-on: ubuntu-latest
    # Generous because of the arm64 option: the dashboard runs `npm ci` twice and a
    # full Next.js production build, and under QEMU emulation that is by far the
    # slowest thing here. An amd64-only run finishes in a fraction of this.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      # Both needed by attest-build-provenance: it signs with a short-lived OIDC
      # token and writes the attestation back to the registry.
      id-token: write
      attestations: write
    strategy:
      # One broken Dockerfile should report as one broken image, not cancel the
      # twelve that were fine.
      fail-fast: false
      matrix:
        # From tools/build_images.py, so this list and the one `task images:build`
        # uses locally cannot drift apart. Each entry is {image, context,
        # dockerfile}; the contexts differ because Core, Analysis and docs build
        # from the repository root while every other image builds from its own
        # directory -- see the manifest for why.
        include: ${{ fromJSON(needs.guard.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        # Only when a foreign architecture is actually requested. Installing it
        # unconditionally slows down every amd64-only run for nothing.
        if: contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: needs.guard.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Assemble the tag list
        id: tags
        env:
          REPO: ${{ needs.guard.outputs.registry }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          name="${REPO}/${IMAGE}"

          # Immutable tags only. The moving ones -- latest and the minor -- are
          # applied by the `promote` job once every image has been built, because
          # of what fail-fast: false means here: if the twelfth image fails, the
          # other twelve have already been pushed. Moving `latest` from inside this
          # job left it pointing at the new version for twelve images and the
          # previous one for the fourteenth, which is a stack nobody assembled and
          # nobody tested.
          #
          # `sha-` is what makes a published image traceable back to a source tree
          # without trusting a mutable tag.
          tags="${name}:${VERSION}"$'\n'"${name}:sha-${GITHUB_SHA::7}"

          # Every first-party image reports the exact release and source commit in
          # its health metadata. The dashboard also uses SOURCE_VERSION and
          # SOURCE_COMMIT for its Corresponding Source link. Dockerfiles declare
          # these arguments with development defaults for local builds.
          args="SOURCE_VERSION=${VERSION}"$'\n'"SOURCE_COMMIT=${GITHUB_SHA}"

          {
            echo "list<<EOF"
            echo "$tags"
            echo "EOF"
            echo "build_args<<EOF"
            echo "$args"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$tags"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ needs.guard.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.list }}
          build-args: ${{ steps.tags.outputs.build_args }}
          # Scoped per image: a single shared scope has all fourteen builds
          # evicting each other's layers, which is slower than no cache at all.
          cache-from: type=gha,scope=${{ matrix.image }}
          # Mode per image, from the manifest. Scoped per image because one shared
          # scope has all fourteen builds evicting each other's layers, which is
          # slower than no cache at all -- and `max` only where the build is long,
          # because the Actions cache is 10 GB for the whole repository and
          # fourteen max scopes overflow it into the same eviction fight.
          cache-to: type=gha,scope=${{ matrix.image }},mode=${{ matrix.cache }}
          labels: |
            org.opencontainers.image.title=quantified-self/${{ matrix.image }}
            org.opencontainers.image.version=${{ needs.guard.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Attest provenance
        if: needs.guard.outputs.push == 'true' && !github.event.repository.private
        # Signed provenance is worth having and is not worth failing a release
        # over. Without this, an attestation hiccup -- a rate limit across fourteen
        # parallel calls, or a repository that is not eligible while it is still
        # private -- fails the build leg *after* the image is pushed, which skips
        # promote and release. That leaves fourteen published images with no
        # floating tags and no release: exactly the state the promote/release split
        # exists to prevent, reached through the cheapest possible error.
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.guard.outputs.registry }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record the digest
        if: needs.guard.outputs.push == 'true'
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO: ${{ needs.guard.outputs.registry }}
        run: |
          set -euo pipefail
          mkdir -p digests
          # Collected by the release job to write digests into the release notes,
          # which is what lets a deployment pin something immutable.
          echo "${REPO}/${IMAGE}@${DIGEST}" > "digests/${IMAGE}.txt"

      - name: Upload the digest
        if: needs.guard.outputs.push == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}
          path: digests/
          retention-days: 1

  promote:
    name: Move the floating tags
    needs: [guard, build]
    # `needs` alone is the gate: a failed matrix leg fails `build`, which skips
    # this job, which is the entire point of separating it. Nothing floats until
    # all fourteen images of this version exist.
    if: needs.guard.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # No setup-buildx-action: `imagetools` talks to the registry directly and
      # the runner's docker CLI already ships the buildx plugin. Setting up a
      # builder container here would be a container per run for nothing.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Add latest and the minor tag
        env:
          REGISTRY: ${{ needs.guard.outputs.registry }}
          MATRIX: ${{ needs.guard.outputs.matrix }}
          VERSION: ${{ needs.guard.outputs.version }}
          MINOR: ${{ needs.guard.outputs.minor }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
          TAG_LATEST: ${{ inputs.tag_latest }}
          DEFAULT_BRANCH: ${{ needs.guard.outputs.default_branch }}
        run: |
          set -euo pipefail

          extra=()
          if [ "$PRERELEASE" = "true" ]; then
            echo "::notice::${VERSION} is a pre-release: nothing floats to it."
          elif [ "$DEFAULT_BRANCH" != "true" ]; then
            echo "::notice::Not the default branch: nothing floats to ${VERSION}."
          else
            extra+=("$MINOR")
            [ "$TAG_LATEST" = "true" ] && extra+=("latest")
          fi

          if [ ${#extra[@]} -eq 0 ]; then
            echo "No floating tags to move. The version and sha- tags are published."
            echo "Published \`${VERSION}\` and \`sha-${GITHUB_SHA::7}\`. No floating tag was moved." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # imagetools re-points a tag at an existing manifest; it neither rebuilds
          # nor re-uploads a layer, and it keeps the multi-architecture index and
          # the attestations intact, because those are addressed by digest.
          #
          # Deliberately not `set -e` behaviour per image: aborting halfway through
          # fourteen registry calls recreates the split `latest` this job exists to
          # prevent, only with no release to explain it. Every image is attempted,
          # what failed is named, and the job fails at the end so a re-run -- which
          # is idempotent, since the version tag it reads from is already published
          # -- finishes the rest.
          failed=()
          for image in $(printf '%s' "$MATRIX" | jq -r '.[].image'); do
            name="${REGISTRY}/${image}"
            args=()
            for tag in "${extra[@]}"; do
              args+=(--tag "${name}:${tag}")
            done
            echo "==> ${name}: ${extra[*]}"
            if ! docker buildx imagetools create "${args[@]}" "${name}:${VERSION}"; then
              echo "::error::could not move ${extra[*]} for ${name}"
              failed+=("$image")
            fi
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "Moved ${extra[*]} for all but: ${failed[*]}. Re-run this workflow with the same version to finish." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Moved ${extra[*]} to ${VERSION} for every image." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub Release
    needs: [guard, build, promote]
    # Only when every image made it and its tags are final. A release whose notes
    # list fourteen images while thirteen exist is worse than no release.
    if: needs.guard.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Same-run artifact downloads authenticate with the runtime token rather than
      # GITHUB_TOKEN, so this should not be needed. It is one line, and this job
      # runs after all fourteen pushes and the tag move -- the worst place in the
      # workflow to find out that an implementation detail changed.
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Collect the digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Build the deployment bundle
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          TAG: ${{ needs.guard.outputs.tag }}
          REGISTRY: ${{ needs.guard.outputs.registry }}
        run: |
          set -euo pipefail

          # Everything a host needs to run this release and nothing else: no
          # source, no toolchain, no git. This is the difference between "clone
          # the repository and build" and "download 4 KB and start".
          bundle="quantified-self-${VERSION}"
          mkdir -p "$bundle/infra/db" "$bundle/tools"

          cp docker-compose.prod.yml "$bundle/"
          # A distributed artefact should say what it is licensed under, and
          # AGPL-3.0 section 4 asks for the copyright notice to travel with the
          # copy -- which is why NOTICE ships too, not only the licence text.
          cp LICENSE NOTICE "$bundle/"
          # Mounted by the postgres service at this exact relative path.
          cp infra/db/init.sql "$bundle/infra/db/"
          # The deployment guide's verification step calls this, and a bundle
          # deploy has no checkout to call it from. curl and a shell are all it
          # needs (python3, if present, additionally decodes the self-report).
          cp tools/smoke_deployment.sh "$bundle/tools/"

          # A .env with the version pinned and the three secrets left empty on
          # purpose: compose refuses to start until they are set, which is the
          # intended behaviour and not a bug to work around.
          cat > "$bundle/.env" <<EOF
          # Quantified Self ${VERSION} — deployment configuration.
          #
          # Generate each secret with:
          #     python -c "import secrets; print(secrets.token_urlsafe(48))"
          #
          # Do not reuse a value between the three. ENCRYPTION_KEY cannot be
          # changed later without re-encrypting stored connector credentials
          # first — see the deployment guide before you touch it.

          QS_VERSION=${VERSION}
          QS_IMAGE_PREFIX=${REGISTRY}
          # Internal broker address for the standard Compose/Coolify network.
          # Leave this unchanged unless the service name or port is customized.
          NATS_URL=nats://nats:4222

          PUBLIC_HOST=your-host.example
          ENVIRONMENT=production

          # Left empty on purpose: empty means the compose file derives it from
          # PUBLIC_HOST, so setting the host once is enough. A literal value here
          # would have overridden that default and quietly kept pointing at
          # your-host.example, since nothing tells an operator to edit two
          # variables for one hostname. Set it only for an additional origin.
          ALLOWED_ORIGINS=

          JWT_SECRET=
          INTERNAL_SERVICE_SECRET=
          ENCRYPTION_KEY=

          # Set this BEFORE the first start. PostgreSQL writes the password once,
          # while initialising an empty data directory; afterwards this line is
          # only what Core connects with, and changing it locks Core out instead of
          # changing anything. Empty means the published default qs_dev_password.
          POSTGRES_PASSWORD=

          # Self-registration stays closed; create the first account with
          # \`docker compose run --rm core python -m core.create_owner\`.
          ALLOW_REGISTRATION=false

          # Cloudflare Tunnel token; required if using the default secure tunnel setup.
          TUNNEL_TOKEN=
          EOF

          cat > "$bundle/README.md" <<EOF
          # Quantified Self ${VERSION}

          Full guide: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}/docs/deployment.md

          The bundle contains the deployment topology. Use docker-compose.prod.yml for a standalone
          host.

              # 1. Fill in PUBLIC_HOST, the three secrets and POSTGRES_PASSWORD.
              #    The database password is only choosable now: PostgreSQL sets
              #    it while initialising the empty volume in step 3.
              \$EDITOR .env

              # 2. Names any variable that is still missing.
              docker compose -f docker-compose.prod.yml config >/dev/null

              # 3. Pull and start. The images are ${VERSION}, pinned in .env.
              #    Migrating is part of this: the core-migrate service runs
              #    'alembic upgrade head' and exits, and Core starts only once it
              #    has succeeded. One migrating process however many replicas.
              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d

              # 4. There is no default account, and sign-up is closed.
              docker compose -f docker-compose.prod.yml run --rm core \\
                python -m core.create_owner --email you@example.com --workspace "My Data"

              # 5. Check it from the outside.
              bash tools/smoke_deployment.sh https://your-host.example

          To upgrade, change QS_VERSION in .env, then repeat step 3.
          To roll back, set the previous version and repeat step 3 — but read the
          guide first if the release in between contained a migration.
          EOF

          tar -czf "${bundle}-deploy.tar.gz" "$bundle"
          echo "Bundle contents:"
          tar -tzf "${bundle}-deploy.tar.gz"

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
          TAG: ${{ needs.guard.outputs.tag }}
          REGISTRY: ${{ needs.guard.outputs.registry }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail

          {
            echo "## Deploying this release"
            echo
            echo "Download \`quantified-self-${VERSION}-deploy.tar.gz\` below, unpack it, fill in"
            echo "\`.env\`, and follow the steps in its README — no checkout and no build"
            echo "on the host. The full procedure, including the \`ENCRYPTION_KEY\` ordering trap,"
            echo "is in [the deployment guide](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}/docs/deployment.md)."
            echo
            echo '```bash'
            # The versioned URL, not /releases/latest/download/: that alias
            # resolves to the newest release and then looks for this exact asset
            # name inside it, so it 404s the moment anything newer ships.
            echo "curl -fsSL ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/quantified-self-${VERSION}-deploy.tar.gz | tar -xz"
            echo "cd quantified-self-${VERSION}"
            echo '```'
            echo
            echo "Already deployed? Set \`QS_VERSION=${VERSION}\` in \`.env\`, then \`docker compose"
            echo "-f docker-compose.prod.yml pull && up -d\` and run the migration step."
            echo
            echo "## Images"
            echo
            echo "Built for \`${PLATFORMS}\` from \`${GITHUB_SHA}\`, with signed build provenance."
            echo "Pin the digest rather than the tag where it has to be reproducible."
            echo
            echo "| Image | Digest |"
            echo "| --- | --- |"
            for f in digests/*.txt; do
              ref=$(cat "$f")
              name="${ref%@*}"
              digest="${ref#*@}"
              echo "| \`${name}:${VERSION}\` | \`${digest}\` |"
            done
            echo
            echo "## Changes"
            echo
          } > notes.md

          # Generated explicitly rather than with `gh release create
          # --generate-notes`, which replaces the body it is given instead of
          # appending to it -- everything above would have been dropped.
          #
          # Best-effort: the very first release has no previous tag to diff
          # against, and a failure here is not worth failing a release over.
          if gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
               -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
               --jq .body >> notes.md; then
            echo "Changelog generated."
          else
            echo "_Changelog could not be generated automatically._" >> notes.md
            echo "::warning::generate-notes failed; the release notes have no changelog."
          fi

          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
          VERSION: ${{ needs.guard.outputs.version }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          set -euo pipefail

          args=(
            "$TAG"
            --target "$GITHUB_SHA"
            --title "v${VERSION}"
            --notes-file notes.md
          )
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)

          # Creates the tag at --target as part of the release, so there is no
          # separate tag push to get out of step with it.
          gh release create "${args[@]}" "quantified-self-${VERSION}-deploy.tar.gz"

          echo "### Released [v${VERSION}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})" >> "$GITHUB_STEP_SUMMARY"

      - name: Remind about package visibility
        env:
          # From the manifest rather than written out, so a fourteenth importer
          # does not make this sentence wrong.
          IMAGE_COUNT: ${{ needs.guard.outputs.image_count }}
        run: |
          {
            echo "If this was the first release, all ${IMAGE_COUNT} packages are still **private**:"
            echo "GHCR does not inherit the repository's visibility. Until they are public,"
            echo "\`docker compose pull\` fails with \`denied\` for everyone but you."
            echo
            echo "Set it once per package under"
            echo "<${GITHUB_SERVER_URL}/users/${GITHUB_REPOSITORY_OWNER}/packages> →"
            echo "Package settings → Change visibility."
          } >> "$GITHUB_STEP_SUMMARY"
