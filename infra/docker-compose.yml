services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: qs_dev
      POSTGRES_PASSWORD: qs_dev_password
      POSTGRES_DB: quantified_self
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - qs-network

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222" # Client port
      - "127.0.0.1:8222:8222" # Monitoring port — bound to localhost only (SECURITY H5)
    command: --jetstream --store_dir /data
    volumes:
      - natsdata:/data
    networks:
      - qs-network

  core:
    build:
      context: ../services/core
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - nats
    environment:
      - DATABASE_URL=postgresql+asyncpg://qs_dev:qs_dev_password@postgres:5432/quantified_self
      - NATS_URL=nats://nats:4222
    networks:
      - qs-network

  traefik:
    image: traefik:v3.1
    container_name: qs-traefik
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "${TRAEFIK_HTTP_PORT:-8080}:80"
      - "8081:8080" # Traefik Dashboard (admin UI at http://localhost:8081)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - qs-network

  api-gateway:
    build:
      context: ../services/api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - core
      - nats
    environment:
      - CORE_SERVICE_URL=http://core:8001
      - ENVIRONMENT=dev
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=(Host(`quantified-self.example.com`) || Host(`localhost`)) && (PathPrefix(`/api`) || Path(`/health`))"
      - "traefik.http.routers.gateway.entrypoints=web"
      - "traefik.http.routers.gateway.priority=10"
      - "traefik.http.services.gateway.loadbalancer.server.port=8000"
    networks:
      - qs-network

  yazio-importer:
    build:
      context: ../services/importers/yazio
    depends_on:
      - nats
      - core
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
    networks:
      - qs-network

  dawarich-importer:
    build:
      context: ../services/importers/dawarich
    depends_on:
      - nats
      - core
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
    networks:
      - qs-network

  whoop-importer:
    build:
      context: ../services/importers/whoop
    depends_on:
      - nats
      - core
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
    networks:
      - qs-network

  apple-health-importer:
    build:
      context: ../services/importers/apple_health
    ports:
      - "8005:8005"
    depends_on:
      - nats
      - core
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - PORT=8005
    networks:
      - qs-network

  streak-importer:
    build:
      context: ../services/importers/streak
    ports:
      - "8006:8006"
    depends_on:
      - nats
      - core
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - PORT=8006
    networks:
      - qs-network

  home-assistant-importer:
    build: { context: ../services/importers/home_assistant }
    depends_on: [nats, core]
    environment: [NATS_URL=nats://nats:4222, CORE_SERVICE_URL=http://core:8001]
    networks: [qs-network]

  weather-importer:
    build: { context: ../services/importers/weather }
    depends_on: [nats, core]
    environment: [NATS_URL=nats://nats:4222, CORE_SERVICE_URL=http://core:8001]
    networks: [qs-network]

  calendar-importer:
    build: { context: ../services/importers/calendar }
    depends_on: [nats, core]
    environment: [NATS_URL=nats://nats:4222, CORE_SERVICE_URL=http://core:8001]
    networks: [qs-network]

  dashboard:
    build:
      context: ../apps/dashboard
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=(Host(`quantified-self.example.com`) || Host(`localhost`)) && (Path(`/`) || PathPrefix(`/_next`))"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.priority=1"
      - "traefik.http.services.dashboard.loadbalancer.server.port=3000"
    networks:
      - qs-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: qs-cloudflared-tunnel
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - traefik
      - api-gateway
    networks:
      - qs-network


volumes:
  pgdata:
  natsdata:

networks:
  qs-network:
    driver: bridge
