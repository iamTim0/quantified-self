services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: qs_dev
      POSTGRES_PASSWORD: qs_dev_password
      POSTGRES_DB: quantified_self
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - qs-network

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222" # Client port
      - "127.0.0.1:8222:8222" # Monitoring port — bound to localhost only (SECURITY H5)
    command: --jetstream --store_dir /data
    volumes:
      - natsdata:/data
    networks:
      - qs-network

  core:
    build:
      context: ../services/core
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - nats
    environment:
      - DATABASE_URL=postgresql+asyncpg://qs_dev:qs_dev_password@postgres:5432/quantified_self
      - NATS_URL=nats://nats:4222
    networks:
      - qs-network

  api-gateway:
    build:
      context: ../services/api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - core
      - nats
    environment:
      - CORE_SERVICE_URL=http://core:8001
      - ENVIRONMENT=dev
    networks:
      - qs-network

  yazio-importer:
    build:
      context: ../services/importers/yazio
    depends_on:
      - nats
      - core
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
    networks:
      - qs-network

  dawarich-importer:
    build:
      context: ../services/importers/dawarich
    depends_on:
      - nats
      - core
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
    networks:
      - qs-network

  whoop-importer:
    build:
      context: ../services/importers/whoop
    depends_on:
      - nats
      - core
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
    networks:
      - qs-network

  apple-health-importer:
    build:
      context: ../services/importers/apple_health
    ports:
      - "8005:8005"
    depends_on:
      - nats
      - core
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - PORT=8005
    networks:
      - qs-network

  dashboard:
    build:
      context: ../apps/dashboard
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    networks:
      - qs-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: qs-cloudflared-tunnel
    command: tunnel --no-autoupdate --url http://api-gateway:8000
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - qs-network


volumes:
  pgdata:
  natsdata:

networks:
  qs-network:
    driver: bridge
