services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: qs_dev
      POSTGRES_PASSWORD: qs_dev_password
      POSTGRES_DB: quantified_self
      # The HA image defaults to /home/postgres/pgdata/data. Keep the database
      # inside the named volume instead of the disposable container layer.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # Here so that `core-migrate` can wait for a database that accepts
      # connections. Without it the migration would race the initialisation of an
      # empty volume, which is the one moment it is guaranteed to lose.
      test: ["CMD-SHELL", "pg_isready -U qs_dev -d quantified_self"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres-volume-init:
        condition: service_completed_successfully
    networks:
      - qs-network

  # The HA image runs as UID 1000. Normalize ownership before PostgreSQL
  # initializes the named volume on a fresh checkout or a managed host.
  postgres-volume-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /var/lib/postgresql/data && chmod 700 /var/lib/postgresql/data"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - qs-network

  nats:
    image: nats:2.10-alpine
    ports:
      - "127.0.0.1:4222:4222" # Client port
      - "127.0.0.1:8222:8222" # Monitoring port — bound to localhost only (SECURITY H5)
    # `--http_port` is what makes the published monitoring port above answer at all.
    # Without it nothing listened there, so the one place that shows a consumer's pending
    # count -- the number that says ingestion has stopped rather than slowed -- refused
    # every connection while looking configured.
    command: --jetstream --store_dir /data --http_port 8222
    volumes:
      - natsdata:/data
    networks:
      - qs-network

  # Migrations, once per `up`, before Core serves a request.
  #
  # `task dev:up` did not migrate at all -- only `dev:docker` did, through an
  # `exec` in the Taskfile -- so a checkout whose migrations had moved ran against
  # the schema the volume happened to hold. That is not a hypothetical: this stack
  # sat one revision behind for weeks, `sync_runs.points_expected` did not exist,
  # and every import run answered 500 from a column that was committed long before.
  #
  # The same build as Core rather than a shared image tag: Compose would try to
  # *pull* an image it is not asked to build, and the build is a cache hit anyway.
  core-migrate:
    build:
      context: ..
      dockerfile: services/core/Dockerfile.migrate
    # Not `always` (nothing sets it here) and meant to exit: `core` waits for that
    # exit to succeed.
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # A migration needs the database and nothing else.
      - DATABASE_URL=postgresql+asyncpg://qs_dev:qs_dev_password@postgres:5432/quantified_self
    networks:
      - qs-network

  core:
    build:
      # Repo root: Core needs packages/proto, which is outside services/core.
      context: ..
      dockerfile: services/core/Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
      # gRPC read API, consumed by the Analysis Service.
      - "127.0.0.1:50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      # Starts on a current schema or not at all.
      core-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+asyncpg://qs_dev:qs_dev_password@postgres:5432/quantified_self
      - NATS_URL=nats://nats:4222
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-dev-internal-service-secret-quantified-self-2026}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-quantified-self-2026}
      - ENVIRONMENT=${ENVIRONMENT:-dev}
    networks:
      - qs-network

  analysis:
    # Reads through Core's gRPC API and owns no database connection
    # (AGENTS.md rules 1 and 3). It has deliberately no DATABASE_URL.
    build:
      context: ..
      dockerfile: services/analysis/Dockerfile
    ports:
      # Direct MCP testing is local-only; production does not publish Analysis.
      - "127.0.0.1:8010:8010"
    depends_on:
      - core
    environment:
      - CORE_GRPC_URL=core:50051
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-quantified-self-2026}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-dev-internal-service-secret-quantified-self-2026}
      # A container has no OS keyring. Codex may use its file store only because
      # the entire home below is RAM-backed and disappears on restart.
      - CHAT_CREDENTIALS_STORE=file
      - CODEX_HOME=/run/qs-codex
    tmpfs:
      - /run/qs-codex:mode=0700
    networks:
      - qs-network

  traefik:
    image: traefik:v3.1
    container_name: qs-traefik
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "${TRAEFIK_HTTP_PORT:-8080}:80"
      - "8081:8080" # Traefik Dashboard (admin UI at http://localhost:8081)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - qs-network

  api-gateway:
    build:
      context: ../services/api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - core
      - nats
    environment:
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - STREAK_IMPORTER_URL=http://streak-importer:8006
      # Defaults to 127.0.0.1:8005, which in this container is the Gateway itself,
      # so POST /api/v1/ingest/apple-health proxied to nothing.
      - APPLE_HEALTH_IMPORTER_URL=http://apple-health-importer:8005
      - WHOOP_IMPORTER_URL=http://whoop-importer:8007
      # The Gateway serves the UI on / by proxying it. In this network that is
      # the container; the code default is loopback, for a local checkout.
      - DASHBOARD_URL=http://dashboard:3000
      - ENVIRONMENT=dev
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-quantified-self-2026}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`) || Path(`/health`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.priority=10"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    networks:
      - qs-network

  yazio-importer:
    build:
      # Repo root: the importer needs packages/shared-schemas for the metric
      # catalog, which is outside services/importers.
      context: ..
      dockerfile: services/importers/yazio/Dockerfile
    depends_on:
      - nats
      - core
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-dev-internal-service-secret-quantified-self-2026}
    networks:
      - qs-network

  dawarich-importer:
    build:
      # Repo root: the importer needs packages/shared-schemas for the metric
      # catalog, which is outside services/importers.
      context: ..
      dockerfile: services/importers/dawarich/Dockerfile
    depends_on:
      - nats
      - core
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-dev-internal-service-secret-quantified-self-2026}
    networks:
      - qs-network

  whoop-importer:
    build:
      # Repo root: the importer needs packages/shared-schemas for the metric
      # catalog, which is outside services/importers.
      context: ..
      dockerfile: services/importers/whoop/Dockerfile
    depends_on:
      - nats
      - core
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-dev-internal-service-secret-quantified-self-2026}
      - PORT=8007
    # Not published: the export upload is reached through the Gateway, which is
    # where the session is checked. The port exists for that hop alone.
    expose:
      - "8007"
    networks:
      - qs-network

  apple-health-importer:
    build:
      # Repo root: the importer needs packages/shared-schemas for the metric
      # catalog, which is outside services/importers.
      context: ..
      dockerfile: services/importers/apple_health/Dockerfile
    ports:
      - "8005:8005"
    depends_on:
      - nats
      - core
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - PORT=8005
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-dev-internal-service-secret-quantified-self-2026}
    networks:
      - qs-network

  streak-importer:
    build:
      # Repo root: the importer needs packages/shared-schemas for the metric
      # catalog, which is outside services/importers.
      context: ..
      dockerfile: services/importers/streak/Dockerfile
    ports:
      - "8006:8006"
    depends_on:
      - nats
      - core
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - PORT=8006
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-dev-internal-service-secret-quantified-self-2026}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ingest.rule=PathPrefix(`/ingest`)"
      - "traefik.http.routers.ingest.entrypoints=web"
      - "traefik.http.routers.ingest.priority=30"
      - "traefik.http.services.ingest.loadbalancer.server.port=8006"
    networks:
      - qs-network
  home-assistant-importer:
    build:
      # Repo root: the importer needs packages/shared-schemas for the metric
      # catalog, which is outside services/importers.
      context: ..
      dockerfile: services/importers/home_assistant/Dockerfile
    depends_on: [nats, core]
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-dev-internal-service-secret-quantified-self-2026}
    networks: [qs-network]

  weather-importer:
    build:
      # Repo root: the importer needs packages/shared-schemas for the metric
      # catalog, which is outside services/importers.
      context: ..
      dockerfile: services/importers/weather/Dockerfile
    depends_on: [nats, core]
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-dev-internal-service-secret-quantified-self-2026}
    networks: [qs-network]

  calendar-importer:
    build:
      # Repo root: the importer needs packages/shared-schemas for the metric
      # catalog, which is outside services/importers.
      context: ..
      dockerfile: services/importers/calendar/Dockerfile
    depends_on: [nats, core]
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-dev-internal-service-secret-quantified-self-2026}
    networks: [qs-network]

  dashboard:
    build:
      context: ../apps/dashboard
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    # No NEXT_PUBLIC_API_URL: it used to be set here and did nothing, because Next
    # inlines NEXT_PUBLIC_* at build time. The UI calls its own origin, so the way
    # in is Traefik on http://localhost:${TRAEFIK_HTTP_PORT:-8080} -- it routes /
    # here and /api to the Gateway. Opening this container's own port 3000 skips
    # Traefik, and then nothing serves /api.
    labels:
      # `workspace`, priority 1: the UI is whatever no other route claimed. The
      # four roles and why they are shaped this way are documented once, in
      # docker-compose.prod.yml.
      - "traefik.enable=true"
      - "traefik.http.routers.workspace.rule=PathPrefix(`/`)"
      - "traefik.http.routers.workspace.entrypoints=web"
      - "traefik.http.routers.workspace.priority=1"
      - "traefik.http.services.workspace.loadbalancer.server.port=3000"
    networks:
      - qs-network

  docs:
    image: squidfunk/mkdocs-material:latest
    working_dir: /docs-workspace
    command: serve --dev-addr=0.0.0.0:8003
    volumes:
      - ..:/docs-workspace:ro
    labels:
      - "traefik.enable=true"
      # No stripprefix here, deliberately, and this is the one label that differs
      # from docker-compose.prod.yml. `mkdocs serve` reads site_url, which ends in
      # /docs/, and serves the site under that prefix -- its own log says
      # `Serving on http://0.0.0.0:8003/docs/`. Stripping /docs handed it `GET /`,
      # which it answered with `302 -> /docs/`, which Traefik stripped again: a
      # redirect loop, and /docs was simply unreachable in the dev stack.
      #
      # Production strips correctly, because there the image is a `mkdocs build`
      # site served from a root and the prefix really is Traefik's to remove.
      - "traefik.http.routers.docs.rule=PathPrefix(`/docs`)"
      - "traefik.http.routers.docs.entrypoints=web"
      - "traefik.http.routers.docs.priority=20"
      - "traefik.http.services.docs.loadbalancer.server.port=8003"
    networks:
      - qs-network

  # Behind a profile, so `task dev:up` no longer starts it: without a token this
  # container exited and `restart: unless-stopped` restarted it forever, on every
  # dev machine that does not use a tunnel. `task dev:tunnel` names the service
  # explicitly, which activates its profile.
  #
  # The token goes through the environment, which is where cloudflared looks for
  # it. As a command-line flag it did not survive an empty value: Compose drops
  # the empty word, so `--token` arrived with nothing after it and the CLI failed
  # to parse its own arguments.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: qs-cloudflared-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
    depends_on:
      - traefik
      - api-gateway
    networks:
      - qs-network


volumes:
  pgdata:
  natsdata:

networks:
  qs-network:
    driver: bridge
