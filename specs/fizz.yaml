# Model-checker bounds, applied to every spec in this directory.
#
# Fizzbee defaults to max_actions: 100, meaning it explores traces up to a hundred
# actions deep. For these specs that does not terminate in any useful time --
# tenant_isolation was still enumerating past 160,000 states after 70 seconds.
#
# Every invariant here is about a short causal sequence: insert, grant, query,
# revoke, query again. Six actions is enough to reach each of those and to
# interleave them, while keeping a full run to a few seconds so the check can sit
# in CI on every push.
#
# Raise maxActions temporarily when adding a property that needs a longer trace,
# and note in the spec why the deeper bound is required.
# Most specs here model a workflow that finishes: plan an import, log in and log
# out, upload a CSV. Once the terminal state is reached no action is enabled, and
# Fizzbee reports that as DEADLOCK -- seven of the twelve failed on it. For a
# terminating model that is the intended end, not a defect.
#
# The cost is real: this also switches off deadlock detection for the genuinely
# concurrent models (distributed_ingestion in particular), where a state with no
# enabled action *would* be a bug. Fizzbee reads one fizz.yaml per directory, so
# the setting cannot currently be narrowed to individual specs. A spec that needs
# the check back should move into its own subdirectory with its own fizz.yaml.
deadlock_detection: false

options:
  maxActions: 6
  maxConcurrentActions: 2
