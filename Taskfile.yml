version: '3'

tasks:
  dev:up:
    desc: "Start all services in the background using docker compose"
    cmds:
      - docker compose --env-file .env -f infra/docker-compose.yml up -d

  dev:down:
    desc: "Stop and remove all running services"
    cmds:
      - docker compose -f infra/docker-compose.yml down

  dev:logs:
    desc: "Follow logs for all services"
    cmds:
      - docker compose -f infra/docker-compose.yml logs -f

  dev:tunnel:
    # cloudflared sits behind the `tunnel` profile, so `dev:up` no longer starts
    # it. Naming the service explicitly activates its profile, which is what makes
    # this task the way in.
    desc: "Start Cloudflare Tunnel and display public HTTPS endpoint URL"
    cmds:
      - docker compose --env-file .env -f infra/docker-compose.yml up -d cloudflared
      - uv run python -m tools.tunnel_status

  tunnel:url:
    desc: "Display the active Cloudflare Quick Tunnel public URL and endpoints"
    cmds:
      - uv run python -m tools.tunnel_status

  dev:db-reset:
    desc: "Reset the database and restart postgres"
    cmds:
      - docker compose -f infra/docker-compose.yml down -v
      - docker compose --env-file .env -f infra/docker-compose.yml up -d postgres

  # ─── Production stack (published images) ───────────────────────────────────
  # These drive docker-compose.prod.yml, which pulls the images built by
  # .github/workflows/release.yml instead of building on the host. Set QS_VERSION
  # in .env to pin a release; see docs/deployment.md.

  prod:config:
    desc: "Validate docker-compose.prod.yml and name any variable that is missing"
    cmds:
      - docker compose --env-file .env -f docker-compose.prod.yml config > /dev/null
      - echo "configuration ok"

  prod:pull:
    desc: "Pull the release images named by QS_VERSION in .env"
    cmds:
      - docker compose --env-file .env -f docker-compose.prod.yml pull

  prod:up:
    desc: "Start the production stack from published images (pull, start, migrate)"
    cmds:
      - task: prod:pull
      - docker compose --env-file .env -f docker-compose.prod.yml up -d
      - task: prod:migrate

  prod:migrate:
    desc: "Run Alembic migrations inside the released Core image"
    cmds:
      # A separate step, never a container entrypoint: replicas starting at once
      # would otherwise migrate against each other.
      - docker compose --env-file .env -f docker-compose.prod.yml run --rm core alembic upgrade head

  prod:down:
    desc: "Stop the production stack (volumes are kept)"
    cmds:
      - docker compose -f docker-compose.prod.yml down

  prod:logs:
    desc: "Follow production logs. Usage: task prod:logs -- core"
    cmds:
      - docker compose -f docker-compose.prod.yml logs -f {{.CLI_ARGS}}

  prod:owner:
    desc: "Create the first account in the production stack (sign-up is closed by default)"
    cmds:
      - docker compose --env-file .env -f docker-compose.prod.yml run --rm core python -m core.create_owner {{.CLI_ARGS}}

  images:build:
    desc: "Build all release images locally, exactly as the release workflow does"
    cmds:
      - python tools/build_images.py {{.CLI_ARGS}}

  db:migrate:
    desc: "Run pending Alembic database migrations"
    cmds:
      - uv run --directory services/core alembic upgrade head

  db:rollback:
    desc: "Roll back the last database migration step (downgrade -1)"
    cmds:
      - uv run --directory services/core alembic downgrade -1

  proto:generate:
    desc: "Generate protobuf code"
    cmds:
      - uv run --with grpcio-tools python packages/proto/generate.py

  test:all:
    desc: "Run complete test suite (Specs, Core, Gateway, E2E, and Importers)"
    cmds:
      - task: test:specs
      - task: test:core
      - task: test:gateway
      - task: test:e2e
      - task: test:importers

  test:core:
    desc: "Run Core Data Service tests (requires Postgres on :5433)"
    cmds:
      - uv run --directory services/core --with pytest --with pytest-asyncio pytest tests

  test:gateway:
    desc: "Run API Gateway tests"
    cmds:
      - uv run --directory services/api-gateway --with pytest --with pytest-asyncio pytest tests

  test:e2e:
    desc: "Run end-to-end integration tests for all importers, dashboard API, and UI flows"
    # Runs in Core's environment because the dashboard tests import core.main, and
    # pulls in the extra runtime deps the importer transformers need. tests/e2e/conftest.py
    # puts every service's src/ on sys.path. Requires Postgres on :5433.
    env:
      PYTHONPATH: "{{.ROOT_DIR}}"
    cmds:
      - >-
        uv run --directory services/core
        --with pytest --with pytest-asyncio --with nats-py
        --with icalendar --with recurring-ical-events
        pytest {{.ROOT_DIR}}/tests/e2e --rootdir {{.ROOT_DIR}}

  test:importers:
    desc: "Run unit tests across all importer microservices"
    cmds:
      - for dir in services/importers/*/; do (cd "$dir" && .venv/bin/pytest tests); done

  test:specs:
    desc: "Run Fizzbee model spec invariant tests"
    cmds:
      - cd specs && ../services/importers/yazio/.venv/bin/pytest tests

  test:service:
    desc: "Run tests for a specific service"
    cmds:
      - echo "Running tests for {{.SERVICE}}"
      - uv run --directory services/{{.SERVICE}} pytest tests
    requires:
      vars: [SERVICE]

  check:private:
    desc: "Fail if a tracked file contains personal or environment-specific information"
    # AGENTS.md rule 14. This repository is meant to be published, and a
    # committed email address, deployment hostname, local path or password hash
    # cannot be taken back out by a later commit.
    cmds:
      - python .agents/scripts/check_private_info.py

  fizz:lint:
    desc: "Structural check of the Fizzbee specs — runs anywhere, including plain Windows"
    # Not a model checker: it explores no state space. It catches the mistakes
    # that otherwise cost a full CI round trip, and it is the only spec check
    # that runs natively on Windows, where Fizzbee has no binary at all.
    cmds:
      - python .agents/scripts/lint_specs.py

  fizz:check:
    desc: "Model-check every Fizzbee specification in specs/"
    # `fizzbee check specs/` was never a real command: the binary is called
    # `fizz`, it takes one spec file rather than a directory, and there is no
    # `check` subcommand. The runner uses `fizz` from PATH when present and the
    # container from infra/fizzbee.Dockerfile otherwise, because Fizzbee ships no
    # Windows build.
    cmds:
      - python .agents/scripts/verify_specs.py

  fizz:one:
    desc: "Model-check a single specification, e.g. task fizz:one SPEC=tenant_isolation"
    cmds:
      - python .agents/scripts/verify_specs.py {{.SPEC}}
    requires:
      vars: [SPEC]

  lint:all:
    desc: "Run linters across Python & Next.js dashboard"
    cmds:
      - uv run --with ruff ruff check services/ specs/
      - bun run --cwd apps/dashboard lint
      - bun run --cwd apps/dashboard tsc --noEmit

  run:core:
    desc: "Run Core Data Service on port 8001"
    cmds:
      - uv run --directory services/core python -m core.main

  run:gateway:
    desc: "Run API Gateway Service on port 8000"
    cmds:
      - uv run --directory services/api-gateway python -m gateway.main

  run:importer:yazio:
    desc: "Run the Yazio nutrition importer microservice"
    cmds:
      - uv run --directory services/importers/yazio python -m yazio_importer.main

  run:importer:apple-health:
    desc: "Run the Apple Health importer microservice"
    cmds:
      - uv run --directory services/importers/apple_health python -m apple_health_importer.main

  run:importer:apple_health:
    desc: "Alias for run:importer:apple-health"
    cmds:
      - task: run:importer:apple-health

  run:importer:calendar:
    desc: "Run the Calendar importer microservice"
    cmds:
      - uv run --directory services/importers/calendar python -m calendar_importer.main

  run:importer:dawarich:
    desc: "Run the Dawarich location importer microservice"
    cmds:
      - uv run --directory services/importers/dawarich python -m dawarich_importer.main

  run:importer:home-assistant:
    desc: "Run the Home Assistant importer microservice"
    cmds:
      - uv run --directory services/importers/home_assistant python -m home_assistant_importer.main

  run:importer:home_assistant:
    desc: "Alias for run:importer:home-assistant"
    cmds:
      - task: run:importer:home-assistant

  run:importer:streak:
    desc: "Run the Streak habits importer microservice"
    cmds:
      - uv run --directory services/importers/streak python -m streak_importer.main

  run:importer:weather:
    desc: "Run the Weather importer microservice"
    cmds:
      - uv run --directory services/importers/weather python -m weather_importer.main

  run:importer:whoop:
    desc: "Run the Whoop fitness importer microservice"
    cmds:
      - uv run --directory services/importers/whoop python -m whoop_importer.main

  run:importers:all:
    desc: "Concurrently launch all importer microservices"
    env:
      PYTHONUTF8: "1"
    cmds:
      - >-
        bunx concurrently
        --names "yazio,apple-health,calendar,dawarich,home-assistant,streak,weather,whoop"
        --prefix-colors "yellow,cyan,red,blue,green,yellow,cyan,red"
        --handle-input
        "uv run --directory services/importers/yazio python -m yazio_importer.main"
        "uv run --directory services/importers/apple_health python -m apple_health_importer.main"
        "uv run --directory services/importers/calendar python -m calendar_importer.main"
        "uv run --directory services/importers/dawarich python -m dawarich_importer.main"
        "uv run --directory services/importers/home_assistant python -m home_assistant_importer.main"
        "uv run --directory services/importers/streak python -m streak_importer.main"
        "uv run --directory services/importers/weather python -m weather_importer.main"
        "uv run --directory services/importers/whoop python -m whoop_importer.main"

  docs:serve:
    desc: "Serve MkDocs documentation locally on port 8003"
    cmds:
      - uv run --with mkdocs --with mkdocs-material mkdocs serve --dev-addr 0.0.0.0:8003

  docs:build:
    desc: "Build the static MkDocs documentation site"
    cmds:
      - uv run --with mkdocs --with mkdocs-material mkdocs build --strict

  dashboard:
    desc: "Run the Next.js Web User Dashboard dev server on port 3000 (Bun)"
    cmds:
      - bun run --cwd apps/dashboard dev

  dev:local:
    desc: "Start Postgres, NATS, and Traefik containers, run DB migrations, and launch all local microservices concurrently"
    cmds:
      - docker compose --env-file .env -f infra/docker-compose.yml up -d postgres nats traefik
      - uv run --directory services/core alembic upgrade head
      - task: start:local:services

  start:local:services:
    desc: "Concurrently launch Core, Gateway, all Importers, and Dashboard. Ctrl+C kills all cleanly."
    env:
      PYTHONUTF8: "1"
    cmds:
      - >-
        bunx concurrently
        --names "core,gateway,yazio,apple-health,calendar,dawarich,home-assistant,streak,weather,whoop,dash"
        --prefix-colors "blue,green,yellow,cyan,red,blue,green,yellow,cyan,red,magenta"
        --handle-input
        "uv run --directory services/core python -m core.main"
        "uv run --directory services/api-gateway python -m gateway.main"
        "uv run --directory services/importers/yazio python -m yazio_importer.main"
        "uv run --directory services/importers/apple_health python -m apple_health_importer.main"
        "uv run --directory services/importers/calendar python -m calendar_importer.main"
        "uv run --directory services/importers/dawarich python -m dawarich_importer.main"
        "uv run --directory services/importers/home_assistant python -m home_assistant_importer.main"
        "uv run --directory services/importers/streak python -m streak_importer.main"
        "uv run --directory services/importers/weather python -m weather_importer.main"
        "uv run --directory services/importers/whoop python -m whoop_importer.main"
        "bun run --cwd apps/dashboard dev"


  new:importer:
    desc: "Scaffold a new importer (placeholder)"
    cmds:
      - echo "Scaffolding new importer..."

  logs:
    desc: "High-speed log query tool. Usage: task logs -- --req-id req_abc123 --level ERROR"
    cmds:
      - uv run python -m tools.log_query {{.CLI_ARGS}}
