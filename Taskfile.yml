version: '3'

tasks:
  dev:up:
    desc: "Start all services in the background using docker compose"
    cmds:
      - docker compose -f infra/docker-compose.yml up -d

  dev:down:
    desc: "Stop and remove all running services"
    cmds:
      - docker compose -f infra/docker-compose.yml down

  dev:logs:
    desc: "Follow logs for all services"
    cmds:
      - docker compose -f infra/docker-compose.yml logs -f

  dev:db-reset:
    desc: "Reset the database and restart postgres"
    cmds:
      - docker compose -f infra/docker-compose.yml down -v
      - docker compose -f infra/docker-compose.yml up -d postgres

  db:migrate:
    desc: "Run pending Alembic database migrations"
    cmds:
      - uv run --directory services/core alembic upgrade head

  db:rollback:
    desc: "Roll back the last database migration step (downgrade -1)"
    cmds:
      - uv run --directory services/core alembic downgrade -1

  proto:generate:
    desc: "Generate protobuf code"
    cmds:
      - uv run --with grpcio-tools python packages/proto/generate.py

  test:all:
    desc: "Run tests across all services and specs"
    cmds:
      - uv run --with pytest --with cryptography pytest specs/tests
      - uv run --directory services/core --with pytest --with pytest-asyncio --with httpx --with cryptography --with passlib --with argon2-cffi --with pyjwt python -m pytest tests
      - uv run --directory services/api-gateway --with pytest --with pytest-asyncio --with httpx --with pyjwt python -m pytest tests

  test:service:
    desc: "Run tests for a specific service"
    cmds:
      - echo "Running tests for {{.SERVICE}}"
    requires:
      vars: [SERVICE]

  fizz:check:
    desc: "Run fizzbee model checker on specs/"
    cmds:
      - fizzbee check specs/

  lint:all:
    desc: "Run linters across Python & Next.js dashboard"
    cmds:
      - uv run --with ruff ruff check services/ specs/
      - npx pnpm --prefix apps/dashboard lint
      - npx pnpm --prefix apps/dashboard exec tsc --noEmit

  run:core:
    desc: "Run Core Data Service on port 8001"
    cmds:
      - uv run --directory services/core python -m core.main

  run:gateway:
    desc: "Run API Gateway Service on port 8000"
    cmds:
      - uv run --directory services/api-gateway python -m gateway.main

  run:importer:oura:
    desc: "Run the Oura Ring importer microservice"
    cmds:
      - uv run --directory services/importers/oura python -m oura_importer.main

  run:importer:yazio:
    desc: "Run the Yazio nutrition importer microservice"
    cmds:
      - uv run --directory services/importers/yazio python -m yazio_importer.main

  dashboard:
    desc: "Run the Next.js Web User Dashboard dev server on port 3000 using pnpm"
    cmds:
      - npx pnpm --prefix apps/dashboard dev

  dev:local:
    desc: "Start Postgres + NATS containers, run DB migrations, and launch all 4 local microservices concurrently"
    cmds:
      - docker compose -f infra/docker-compose.yml up -d postgres nats
      - uv run --directory services/core alembic upgrade head
      - task: start:local:services

  start:local:services:
    desc: "Concurrently launch Core, Gateway, Oura Importer, and Dashboard. Ctrl+C kills all cleanly."
    env:
      PYTHONUTF8: "1"
    cmds:
      - >-
        npx --yes concurrently
        --names "core,gateway,oura,dash"
        --prefix-colors "blue,green,yellow,magenta"
        --handle-input
        "uv run --directory services/core python -m core.main"
        "uv run --directory services/api-gateway python -m gateway.main"
        "uv run --directory services/importers/oura python -m oura_importer.main"
        "npx pnpm --prefix apps/dashboard dev"


  new:importer:
    desc: "Scaffold a new importer (placeholder)"
    cmds:
      - echo "Scaffolding new importer..."

  logs:
    desc: "High-speed log query tool. Usage: task logs -- --req-id req_abc123 --level ERROR"
    cmds:
      - uv run python -m tools.log_query {{.CLI_ARGS}}
