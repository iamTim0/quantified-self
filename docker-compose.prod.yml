# Quantified Self Platform — production stack, from published images.
#
# A previous version used a Coolify Compose file that built all fourteen images
# from source on the deployment host, which meant a deploy needed the
# repository, a toolchain and several minutes of CPU, and that what ran in
# production had been built exactly once, by nobody, with no record of from which
# commit. Images are now built and published by `.github/workflows/release.yml`
# and this file only pulls them, so a deploy is a download and a restart.
#
# This is the standalone topology. Coolify deployments use the maintained
# `docker-compose.coolify.yml`, which leaves networking and public routing to
# Coolify's proxy.
#
#     QS_VERSION=1.0.0 docker compose -f docker-compose.prod.yml pull
#     QS_VERSION=1.0.0 docker compose -f docker-compose.prod.yml up -d
#
# See docs/deployment.md for the full procedure, including the one-time GHCR
# package visibility step and how to roll back.
#
# Two deliberate differences from the file this replaces:
#
#   * Core no longer publishes 8001 and 50051 to the host. It serves
#     `/api/v1/internal/*`, which hands out decrypted connector credentials, and
#     docs/operations.md has said all along that it must not be publicly
#     reachable. Traefik never routed it, so the ports were pure attack surface.
#     Everything on the compose network still reaches it by service name.
#   * Traefik's dashboard is bound to loopback instead of every interface. It is
#     served with `--api.insecure=true`, so on a public host it was an
#     unauthenticated admin UI on port 8080.
#
# There is no `version:` key. Compose v2 ignores it and warns about it.

# Where the images come from: QS_IMAGE_PREFIX to deploy from a mirror or from your
# own fork's packages, QS_VERSION to pin a release. `latest` moves with every
# non-prerelease release, which is convenient for a personal deployment and wrong
# for anything you need to be able to roll back — pin the version and change it
# deliberately.

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    restart: always
    environment:
      # Defaulted rather than required, unlike the three secrets on Core below,
      # and the reason is the volume: PostgreSQL sets this password once, when it
      # initialises an empty data directory. Making it required would break every
      # existing deployment that never set it, and setting a *new* value against
      # an already-initialised volume does not change the password — it just
      # leaves Core unable to connect. Postgres publishes no host port, so this
      # is reachable from the compose network only.
      #
      # To change it on a running deployment: ALTER USER in psql first, then here.
      POSTGRES_USER: ${POSTGRES_USER:-qs_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qs_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-quantified_self}
    volumes:
      # timescaledb-ha keeps PGDATA here, not under /var/lib/postgresql/data.
      - pgdata:/home/postgres/pgdata/data
      # Creates the schema for an empty volume and seeds nothing. Alembic owns
      # every change after that. Shipped inside the release bundle, so a deploy
      # without a checkout still has it at this path.
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qs_dev} -d ${POSTGRES_DB:-quantified_self}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qs-network

  nats:
    image: nats:2.10-alpine
    restart: always
    # Monitoring on, port unpublished: reachable from inside the network for
    # `/varz` and `/jsz`, which is where a wedged consumer's pending count shows,
    # and reachable from outside not at all.
    command: --jetstream --store_dir /data --http_port 8222
    volumes:
      - natsdata:/data
    networks:
      - qs-network

  # ─── Routing ───────────────────────────────────────────────────────────────
  # Four routes, one per role, and the rules below are the whole story:
  #
  #   priority  route       rule                                service
  #   ────────  ─────────   ─────────────────────────────────   ──────────────
  #         30  ingest      PathPrefix(`/ingest`)               streak-importer
  #         20  docs        PathPrefix(`/docs`)                 docs
  #         10  api         PathPrefix(`/api`) || Path(`/health`)  api-gateway
  #          1  workspace   PathPrefix(`/`)                     dashboard
  #
  # Higher priority wins, so each route only has to describe what it owns and the
  # workspace takes everything left over. That is what a UI is: the default.
  #
  # It replaced four composed rules that each repeated a host expression and then
  # enumerated paths -- and got them wrong. The dashboard's rule was
  # `Path('/') || PathPrefix('/_next')`, which is two of the twelve routes the app
  # builds, so `/explorer`, `/connectors`, `/auth/callback` and every reload
  # returned Traefik's 404 while client-side navigation worked. Enumerating the
  # pages of a single-page app in a proxy is a list that goes stale on the next
  # feature; a catch-all cannot.
  #
  # No Host() clause anywhere. Every rule used to carry
  # `(Host(`${PUBLIC_HOST}`) || Host(`localhost`)) &&`, which is four copies of one
  # deployment fact, and the `|| Host(localhost)` made it decide almost nothing
  # anyway. Hostname enforcement belongs to whatever terminates TLS in front of
  # this -- the tunnel, Coolify's ingress, a reverse proxy -- and every route here
  # requires a session or an API key regardless. PUBLIC_HOST keeps its job of
  # naming the deployment; it just no longer has to be pasted into proxy rules.
  #
  # Priorities are explicit because Traefik otherwise orders by rule length, which
  # would make `PathPrefix('/')` outrank nothing and depend on how the other rules
  # happen to be spelled.
  traefik:
    image: traefik:v3.1
    container_name: qs-traefik
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      # The only port that has to be public. Put TLS in front of it: a reverse
      # proxy, Coolify's own ingress, or the cloudflared service below.
      - "${QS_HTTP_PORT:-80}:80"
      # Traefik dashboard, loopback only. Reach it over an SSH tunnel:
      #   ssh -L 8081:127.0.0.1:8081 user@host
      - "127.0.0.1:${QS_TRAEFIK_DASHBOARD_PORT:-8081}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - qs-network

  # Migrations, once per deploy, before Core serves a request.
  #
  # This used to be step 4 of the instructions -- `run --rm core alembic upgrade
  # head` after `up -d` -- and an instruction is not a mechanism. A deploy that
  # only starts the stack has nowhere to type it, so a release whose schema had
  # moved ran against the old one: `sync_runs.points_expected` was missing for
  # exactly that reason and every import answered 500, with the column sitting in
  # a migration file that had been committed weeks earlier.
  #
  # A container of its own rather than migrating in Core's entrypoint, and that is
  # what keeps replicas safe: however many Core containers start, exactly one
  # process runs `alembic upgrade head` and the rest wait for it to succeed.
  # Running it by hand stays valid -- `alembic upgrade head` is idempotent.
  core-migrate:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/core-migrate:${QS_VERSION:-latest}
    # Not `always`: this container is meant to exit. A restart policy would run it
    # again forever and `service_completed_successfully` would never fire.
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # A migration needs the database and nothing else. The secrets Core is given
      # are for serving requests; alembic reads none of them.
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-qs_dev}:${POSTGRES_PASSWORD:-qs_dev_password}@postgres:5432/${POSTGRES_DB:-quantified_self}
    networks:
      - qs-network

  core:
    # The only service with a database connection (AGENTS.md rule 1).
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/core:${QS_VERSION:-latest}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      # Refuses to start on a schema that is behind the code, rather than serving
      # 500s from the half of the API that touches the new columns.
      core-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-qs_dev}:${POSTGRES_PASSWORD:-qs_dev_password}@postgres:5432/${POSTGRES_DB:-quantified_self}
      - NATS_URL=nats://nats:4222
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # `:?` rather than `:-`. These previously defaulted to values printed in
      # this repository, so a deployment that never set them ran on secrets
      # anybody could read — and nothing said so. Compose now refuses to start.
      #
      # ENCRYPTION_KEY decrypts stored connector credentials, so changing it is
      # not a restart: re-encrypt first with
      # `python -m core.rotate_encryption_key --old … --new …`, then set it here.
      # See docs/operations.md.
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET; generate with python -c "import secrets; print(secrets.token_urlsafe(48))"}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY; re-encrypt stored credentials before changing it - see docs/operations.md}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET; generate with python -c "import secrets; print(secrets.token_urlsafe(48))"}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
    healthcheck:
      # `/health` is a pure liveness check and touches no table. It stays that way
      # even now that `core-migrate` guarantees the schema is current: a healthcheck
      # that needed a table would make the first install depend on itself.
      #
      # python, not curl or wget: the image is python:3.12-slim and has neither.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - qs-network

  analysis:
    # Reads through Core's gRPC API and owns no database connection
    # (AGENTS.md rules 1 and 3). It has deliberately no DATABASE_URL.
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/analysis:${QS_VERSION:-latest}
    restart: always
    depends_on:
      core:
        condition: service_healthy
    environment:
      - CORE_GRPC_URL=core:50051
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      # Must match Core's, or Analysis cannot authenticate to the gRPC API.
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET}
    networks:
      - qs-network

  api-gateway:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/api-gateway:${QS_VERSION:-latest}
    restart: always
    ports:
      # Kept for direct access and for smoke tests that bypass Traefik. Only
      # Traefik's port needs to be reachable from outside the host; drop this
      # line if you have no use for it.
      - "${QS_GATEWAY_PORT:-8000}:8000"
    depends_on:
      core:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      # Both were missing, and both default to 127.0.0.1 — which inside this
      # container is the Gateway itself, so each of these proxies pointed at
      # nothing. The Gateway is the documented way in for the two push importers
      # (`POST /api/v1/ingest/{streak,apple-health}`), and it is where the request
      # picks up its X-Request-ID, so this is the path that has to work.
      - STREAK_IMPORTER_URL=http://streak-importer:8006
      - APPLE_HEALTH_IMPORTER_URL=http://apple-health-importer:8005
      - WHOOP_IMPORTER_URL=http://whoop-importer:8007
      # Traefik routes / to the dashboard directly, so this only matters for a
      # request that reaches the Gateway on its own port. In this network the UI
      # is the container; the code default is loopback, for a local checkout.
      - DASHBOARD_URL=http://dashboard:3000
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET; it must match Core's or no session will verify}
      # Defaults to this deployment's own origin, not `*`. The file this replaced
      # defaulted to `*`, and the Gateway's CORS middleware runs with
      # allow_credentials=True -- a wildcard there makes Starlette echo whichever
      # origin asks, so any page on the internet could make credentialed calls to
      # this API. Set it explicitly for a multi-origin setup; comma-separated.
      #
      # Both schemes, because a deployment is not always https at the browser:
      # a tunnel or an upstream proxy may terminate TLS and forward http, and
      # QS_HTTP_PORT is plain http by design. An origin that is not listed fails
      # closed -- Starlette omits the header and the browser drops the response --
      # so the cost of guessing the scheme wrong is a feature that silently does
      # not work. The UI itself is unaffected either way: it calls its own origin,
      # and same-origin requests are not CORS.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://${PUBLIC_HOST:-localhost},http://${PUBLIC_HOST:-localhost}}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      # `api`, priority 10. /health is the second clause only because it is a
      # top-level path that monitoring and tools/smoke_deployment.sh already use.
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`) || Path(`/health`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.priority=10"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    networks:
      - qs-network

  dashboard:
    # NEXT_PUBLIC_* is inlined by Next.js at *build* time, so the published image
    # cannot be pointed at an API host from here — setting NEXT_PUBLIC_API_URL on
    # this container has no effect. The image is built without it on purpose:
    # with the variable unset the UI calls `window.location.origin`, which is
    # Traefik, which routes /api to the Gateway. That works for every deployment
    # without a per-host image.
    #
    # If you must have the UI talk to a different origin, build the image
    # yourself with --build-arg NEXT_PUBLIC_API_URL=…; see docs/deployment.md.
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/dashboard:${QS_VERSION:-latest}
    restart: always
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      - NODE_ENV=production
    labels:
      # `workspace`, priority 1: the UI is whatever no other route claimed.
      - "traefik.enable=true"
      - "traefik.http.routers.workspace.rule=PathPrefix(`/`)"
      - "traefik.http.routers.workspace.entrypoints=web"
      - "traefik.http.routers.workspace.priority=1"
      - "traefik.http.services.workspace.loadbalancer.server.port=3000"
    networks:
      - qs-network

  # Static documentation, rendered into the image at build time. The dev stack
  # serves it with `mkdocs serve` against a mount of the repository; production
  # cannot, so this exists — otherwise every in-app /docs/… link 404s.
  docs:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/docs:${QS_VERSION:-latest}
    restart: always
    labels:
      # `docs`, priority 20. A separate service, so a separate route; the
      # middleware strips /docs because the site is built to be served at a root.
      - "traefik.enable=true"
      - "traefik.http.routers.docs.rule=PathPrefix(`/docs`)"
      - "traefik.http.routers.docs.entrypoints=web"
      - "traefik.http.routers.docs.priority=20"
      - "traefik.http.services.docs.loadbalancer.server.port=8003"
      - "traefik.http.middlewares.docs-stripprefix.stripprefix.prefixes=/docs"
      - "traefik.http.routers.docs.middlewares=docs-stripprefix"
    networks:
      - qs-network

  # ─── Importers ────────────────────────────────────────────────────────────
  # Stateless by rule 8: no tokens in the environment, no local storage. Each one
  # fetches its encrypted credentials from Core at runtime and stays idle until a
  # connector is configured in the dashboard.
  #
  # INTERNAL_SERVICE_SECRET is what lets them authenticate for that, and the file
  # this replaces set it on Core but on none of the importers. An importer with
  # the variable unset derives the published development value instead, which
  # does not match a Core that has a real one — so on any correctly configured
  # production deployment, every credential fetch was rejected and every importer
  # sat idle. It must be identical on Core and all eight.

  yazio-importer:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/importer-yazio:${QS_VERSION:-latest}
    restart: always
    depends_on:
      core:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET}
    networks:
      - qs-network

  dawarich-importer:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/importer-dawarich:${QS_VERSION:-latest}
    restart: always
    depends_on:
      core:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET}
    networks:
      - qs-network

  whoop-importer:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/importer-whoop:${QS_VERSION:-latest}
    restart: always
    depends_on:
      core:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET}
      - PORT=8007
    # Not published: the export upload is reached through the Gateway, which is
    # where the session is checked. The port exists for that hop alone.
    expose:
      - "8007"
    networks:
      - qs-network

  apple-health-importer:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/importer-apple-health:${QS_VERSION:-latest}
    restart: always
    ports:
      # Published because the iPhone automation posts here directly; there is no
      # Traefik route for it.
      - "${QS_APPLE_HEALTH_PORT:-8005}:8005"
    depends_on:
      core:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET}
      - PORT=8005
    networks:
      - qs-network

  streak-importer:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/importer-streak:${QS_VERSION:-latest}
    restart: always
    ports:
      - "${QS_STREAK_PORT:-8006}:8006"
    depends_on:
      core:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET}
      - PORT=8006
    labels:
      # `ingest`, priority 30: the short URL an external tracker posts to,
      # without needing a second open port.
      #
      # The rule used to also carry `PathPrefix(`/api/v1/ingest/streak`)`, which
      # overlapped the api route and shadowed it at priority 100. It is gone:
      # the Gateway proxies that path to this importer itself, which is also
      # where the request gets its X-Request-ID. Either way the importer
      # authenticates the API key on its own -- the Gateway adds no auth here.
      - "traefik.enable=true"
      - "traefik.http.routers.ingest.rule=PathPrefix(`/ingest`)"
      - "traefik.http.routers.ingest.entrypoints=web"
      - "traefik.http.routers.ingest.priority=30"
      - "traefik.http.services.ingest.loadbalancer.server.port=8006"
    networks:
      - qs-network

  home-assistant-importer:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/importer-home-assistant:${QS_VERSION:-latest}
    restart: always
    depends_on:
      core:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET}
    networks:
      - qs-network

  weather-importer:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/importer-weather:${QS_VERSION:-latest}
    restart: always
    depends_on:
      core:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET}
    networks:
      - qs-network

  calendar-importer:
    image: ${QS_IMAGE_PREFIX:-ghcr.io/iamtim0/quantified-self}/importer-calendar:${QS_VERSION:-latest}
    restart: always
    depends_on:
      core:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core:8001
      - ANALYSIS_SERVICE_URL=http://analysis:8010
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET}
    networks:
      - qs-network

  # Optional. Only starts with `--profile tunnel`, because an empty TUNNEL_TOKEN
  # made the container restart-loop on every deployment that had no tunnel.
  #
  # `:-` and not `:?`, even though the token is required for this service to work:
  # a profile keeps a service from *starting*, but interpolation happens while the
  # file is being read, for every service in it. With `:?` here, `docker compose
  # config` and `up -d` both failed with "required variable TUNNEL_TOKEN is
  # missing" on every deployment that does not use a tunnel -- which is to say the
  # guard did not protect the tunnel, it blocked the whole stack.
  #
  # The token then goes through the environment rather than the command line,
  # because an empty one did not survive as a flag: Compose drops the empty word,
  # `--token` arrives with nothing after it, and cloudflared fails parsing its own
  # arguments -- inside a restarting container, which is a worse error than the one
  # this replaced. cloudflared reads TUNNEL_TOKEN natively.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: qs-cloudflared-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
    depends_on:
      - traefik
    networks:
      - qs-network

volumes:
  # Unchanged names, so a stack that previously ran docker-compose.coolify.yml in
  # this directory keeps its data: Compose derives the volume key from the
  # project name, and the project name still comes from the directory.
  pgdata:
  natsdata:

networks:
  qs-network:
    driver: bridge
