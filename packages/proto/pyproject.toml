# Makes the generated stubs an installable package.
#
# Before this, `packages/proto/gen/python/` was a directory nothing could import:
# Core's gRPC server and the Analysis Service both need `quantified_self.v1`, and
# neither could reach it. Services depend on this via a `[tool.uv.sources]` path
# entry rather than copying the generated files around, so a protobuf change
# reaches every consumer through `generate.py` as AGENTS.md rule 7 requires.
[project]
name = "qs-proto"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Generated Protobuf and gRPC stubs for the Quantified Self platform"
dependencies = [
    "grpcio>=1.62.0",
    "protobuf>=5.26.0",
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gen/python/quantified_self"]
