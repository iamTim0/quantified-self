syntax = "proto3";

package quantified_self.v1;

import "quantified_self/v1/common.proto";
import "quantified_self/v1/data_point.proto";
import "google/protobuf/timestamp.proto";

message QueryDataPointsRequest {
  string tenant_id = 1;
  optional string metric_type = 2;
  optional string source_id = 3;
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp end_time = 5;
  PaginationRequest pagination = 6;
}

message QueryDataPointsResponse {
  repeated DataPoint data_points = 1;
  PaginationResponse pagination = 2;
}

// Resolution of a server-side metric series. Buckets are aligned to UTC hour
// or UTC day boundaries.
enum MetricSeriesResolution {
  METRIC_SERIES_RESOLUTION_UNSPECIFIED = 0;
  METRIC_SERIES_RESOLUTION_HOUR = 1;
  METRIC_SERIES_RESOLUTION_DAY = 2;
}

// Query an explicitly bounded, source-scoped series. The interval is
// [start_time, end_time), and the response contains one bucket for every
// (metric, source, interval) combination even when no point exists. A gap has
// sample_count == 0 and no value field. Without source_id, sources remain
// separate; the response never adds the same metric across connectors.
message QueryMetricSeriesRequest {
  string tenant_id = 1;
  repeated string metric_types = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  MetricSeriesResolution resolution = 5;
  optional string source_id = 6;
}

message MetricSeriesBucket {
  string metric_type = 1;
  google.protobuf.Timestamp bucket_start = 2;
  optional double value = 3;
  uint64 sample_count = 4;
  // The connector instance that produced this bucket. Buckets are never
  // combined across source instances.
  string source_id = 5;
}

message MetricSeriesIssue {
  // Stable machine-readable code for a non-fatal series condition.
  string code = 1;
  string metric_type = 2;
  repeated string source_ids = 3;
  // For AMBIGUOUS_METRIC_SOURCE: which of `source_ids` answers for this metric.
  //
  // Resolved here rather than by the reader, because the two things the choice
  // needs live here — the tenant's stated preference and how much each connector
  // actually covered the window. A reader that had to choose could only guess,
  // which is why the analysis service used to drop the metric instead.
  //
  // Never a merge: two connectors reporting `steps` cannot be added (rule 19's
  // double count) and averaging them would silently reweight the samples. One
  // source answers, and this field says which, so the result can be attributed.
  string primary_source_id = 4;
  // How the primary was arrived at: `preference` or `coverage`.
  //
  // Lowercase, English and stable — a client compares against it, so it is an
  // identifier and not a sentence (rule 17). It was uppercase until now, which
  // was a second spelling of a convention every neighbouring field already had.
  string primary_reason = 5;
}

message QueryMetricSeriesResponse {
  repeated MetricSeriesBucket buckets = 1;
  repeated MetricSeriesIssue issues = 2;
}

message GetDataPointRequest {
  string tenant_id = 1;
  string data_point_id = 2;
}

message ListMetricTypesRequest {
  string tenant_id = 1;
}

message ListMetricTypesResponse {
  repeated string metric_types = 1;
}

// Which connectors a tenant has configured. The Analysis Service needs this for
// the provenance block it attaches to every result -- "these findings came from
// these sources" -- and it must not reach into the database to get it.
message ListDataSourcesRequest {
  string tenant_id = 1;
}

// No status field: `data_sources` has no status column, and sync state lives in
// `sync_runs`. An always-empty field would read like missing data rather than an
// absent concept. Add one here when there is something real to put in it.
message DataSourceSummary {
  string id = 1;
  string source_type = 2;
  // What the user calls this instance. A tenant may hold several connectors of
  // one type, so `source_type` alone no longer names anything a reader could
  // tell apart. Still deliberately no `config` field: this message crosses a
  // service boundary, and rule 12 says credentials do not.
  string display_name = 3;
}

message ListDataSourcesResponse {
  repeated DataSourceSummary sources = 1;
}

// Analysis validates the JWT locally, then asks Core whether that exact session
// has been revoked. The raw bearer token never crosses this service boundary.
message ValidateUserSessionRequest {
  string tenant_id = 1;
  string user_id = 2;
  string jti = 3;
  google.protobuf.Timestamp issued_at = 4;
}

message ValidateUserSessionResponse {
  bool valid = 1;
  // Stable machine code: VALID, TOKEN_REVOKED, SESSION_ENDED, or USER_NOT_FOUND.
  string code = 2;
}

// The insights bundle is a derivation over a tenant's whole window, and it used
// to be recomputed on every page load. It is now computed once per data change
// and stored — but Core may not compute it (rule 3: Core owns no data science)
// and Analysis may not store it (rule 1: Core owns the database). So the work is
// handed out and handed back over this contract, which is the only channel the
// two services share.
//
// Core queues a run when a tenant's data has moved on; Analysis claims it,
// computes, and returns the result. A claimed run that never comes back is
// failed by Core's own timeout, so a crashed Analysis blocks nothing.
message DueAnalysisReport {
  string run_id = 1;
  string tenant_id = 2;
  // What was asked for, as stored on the run: window length, metric filter.
  string params_json = 3;
  string request_id = 4;
}

message ListDueAnalysisReportsRequest {
  // Upper bound on how many runs one worker takes at a time. Core clamps it.
  int32 limit = 1;
}

message ListDueAnalysisReportsResponse {
  // Claimed by returning them: each is marked running, so a second worker
  // polling at the same moment receives a different set.
  repeated DueAnalysisReport reports = 1;
}

message PutAnalysisReportRequest {
  string run_id = 1;
  string tenant_id = 2;
  // The finished bundle, exactly as the dashboard should receive it.
  string payload_json = 3;
  // Set when the computation failed. Core stores the failure and keeps serving
  // the previous successful run rather than showing the reader an empty page.
  string error_code = 4;
}

message PutAnalysisReportResponse {
  bool stored = 1;
  // STORED, RUN_NOT_FOUND, or RUN_ALREADY_FINISHED.
  string code = 2;
}

// One resistance set, as the strength analysis needs to see it.
//
// A purpose-built call rather than a `group_by_metadata_key` dimension on
// `QueryMetricSeries`. The grouping key here is `exercise_title`, which lives in
// JSONB and which only Core can read (rule 1) — but a general "group by any
// metadata key" field would put an almost-always-empty dimension into the one
// interface every analysis depends on, and every future reader of it would have to
// reason about a case with a single caller. This message says what a set is.
//
// The four `strength_set_*` metrics are assembled back into a row here because a
// set *is* a row: a weight, its repetitions and the volume they make are three
// points sharing a `set_id`, and no consumer wants them apart.
message StrengthSet {
  google.protobuf.Timestamp at = 1;
  // The session the set belongs to. Empty for a set stored before sessions
  // existed; see docs/features/workout-detail.md.
  string session_id = 2;
  string source_id = 3;
  string exercise_title = 4;
  // Canonical MuscleGroup identifier, lowercase and stable (rule 17). Empty when
  // the provider stated no category at all.
  string muscle_group = 5;
  double weight_kg = 6;
  double reps = 7;
  double volume_kg = 8;
  int32 set_number = 9;
  // False for a bodyweight set. Distinct from `weight_kg == 0`, which is what a
  // set with a stated weight of zero would also look like.
  bool has_weight = 10;
}

// Sets in a bounded window, for the strength-progression analysis.
//
// Bounded exactly like `QueryMetricSeries`: a range no longer than a year, a hard
// row ceiling, and a keyset cursor. Analysis holds no database connection (rule 3)
// and this is the only way it can see an exercise name.
message QueryStrengthSetsRequest {
  string tenant_id = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  // Optional filters. Empty means every exercise, every muscle group.
  repeated string exercise_titles = 4;
  repeated string muscle_groups = 5;
  optional string source_id = 6;
  PaginationRequest pagination = 7;
}

message QueryStrengthSetsResponse {
  repeated StrengthSet sets = 1;
  PaginationResponse pagination = 2;
  // True when the window held more sets than the ceiling allows. A shortened
  // answer says so rather than reading as a quiet period.
  bool truncated = 3;
}

service CoreDataService {
  rpc QueryDataPoints(QueryDataPointsRequest) returns (QueryDataPointsResponse);
  rpc QueryMetricSeries(QueryMetricSeriesRequest) returns (QueryMetricSeriesResponse);
  rpc QueryStrengthSets(QueryStrengthSetsRequest) returns (QueryStrengthSetsResponse);
  rpc GetDataPoint(GetDataPointRequest) returns (DataPoint);
  rpc ListMetricTypes(ListMetricTypesRequest) returns (ListMetricTypesResponse);
  rpc ListDataSources(ListDataSourcesRequest) returns (ListDataSourcesResponse);
  rpc ValidateUserSession(ValidateUserSessionRequest) returns (ValidateUserSessionResponse);
  rpc ListDueAnalysisReports(ListDueAnalysisReportsRequest) returns (ListDueAnalysisReportsResponse);
  rpc PutAnalysisReport(PutAnalysisReportRequest) returns (PutAnalysisReportResponse);
}
