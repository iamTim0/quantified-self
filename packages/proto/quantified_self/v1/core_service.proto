syntax = "proto3";

package quantified_self.v1;

import "quantified_self/v1/common.proto";
import "quantified_self/v1/data_point.proto";
import "google/protobuf/timestamp.proto";

message QueryDataPointsRequest {
  string tenant_id = 1;
  optional string metric_type = 2;
  optional string source_id = 3;
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp end_time = 5;
  PaginationRequest pagination = 6;
}

message QueryDataPointsResponse {
  repeated DataPoint data_points = 1;
  PaginationResponse pagination = 2;
}

message GetDataPointRequest {
  string tenant_id = 1;
  string data_point_id = 2;
}

message ListMetricTypesRequest {
  string tenant_id = 1;
}

message ListMetricTypesResponse {
  repeated string metric_types = 1;
}

// Which connectors a tenant has configured. The Analysis Service needs this for
// the provenance block it attaches to every result -- "these findings came from
// these sources" -- and it must not reach into the database to get it.
message ListDataSourcesRequest {
  string tenant_id = 1;
}

// No status field: `data_sources` has no status column, and sync state lives in
// `sync_runs`. An always-empty field would read like missing data rather than an
// absent concept. Add one here when there is something real to put in it.
message DataSourceSummary {
  string id = 1;
  string source_type = 2;
  // What the user calls this instance. A tenant may hold several connectors of
  // one type, so `source_type` alone no longer names anything a reader could
  // tell apart. Still deliberately no `config` field: this message crosses a
  // service boundary, and rule 12 says credentials do not.
  string display_name = 3;
}

message ListDataSourcesResponse {
  repeated DataSourceSummary sources = 1;
}

service CoreDataService {
  rpc QueryDataPoints(QueryDataPointsRequest) returns (QueryDataPointsResponse);
  rpc GetDataPoint(GetDataPointRequest) returns (DataPoint);
  rpc ListMetricTypes(ListMetricTypesRequest) returns (ListMetricTypesResponse);
  rpc ListDataSources(ListDataSourcesRequest) returns (ListDataSourcesResponse);
}
