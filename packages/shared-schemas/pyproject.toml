[project]
name = "qs-shared-schemas"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Shared Pydantic Schemas for Quantified Self"
dependencies = [
    "pydantic>=2.6.0"
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_schemas"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
