[project]
name = "qs-shared-schemas"
version = "0.1.0"
license = "MIT"
description = "Shared Pydantic Schemas for Quantified Self"
dependencies = [
    "pydantic>=2.6.0"
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_schemas"]
