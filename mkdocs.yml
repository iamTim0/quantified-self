site_name: Quantified Self Platform Docs
site_description: Importer, data quality, and analysis documentation for the Quantified Self Platform.
site_url: https://example.com/docs/
docs_dir: docs
site_dir: site
repo_url: https://github.com/iamTim0/quantified-self
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
nav:
  - Start: index.md
  - Architecture: architecture.md
  - Metrics: metrics.md
  - Release and deployment: deployment.md
  - Operations: operations.md
  - Troubleshooting: troubleshooting.md
  - Licensing: licensing.md
  - Importers:
      - Standard: importer-standard.md
      - Contract catalog: importer-contracts.md
      - Overview: importers/index.md
      - Yazio: importers/yazio.md
      - WHOOP: importers/whoop.md
      - Apple Health: importers/apple-health.md
      - Dawarich: importers/dawarich.md
      - Streak: importers/streak.md
      - Home Assistant: importers/home-assistant.md
      - Weather: importers/weather.md
      - Calendar: importers/calendar.md
  - Features:
      - The daily story: features/daily-story.md
      - Smart and force import: features/smart-import.md
      - Data resolution and rollups: features/data-resolution.md
      - Data quality: features/data-quality.md
      - Uploading an export file: features/file-import.md
      - Correlations and simple analyses: features/correlations.md
      - Precomputed reports: features/precomputed-reports.md
      - Metrics from several connectors: features/metric-source-selection.md
      - Stateless MCP analytics: features/mcp.md
      - AI chat: features/ai-chat.md
      - GPS visualization: features/gps-visualization.md
  - Security:
      - Authentication and sessions: features/authentication.md
      - External sign-in (OIDC): features/oidc.md
      - Tenant-bound API keys: features/api-keys.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.details
  # The custom fence is what turns a ```mermaid block into a diagram rather than a
  # syntax-highlighted listing. Without it the page silently prints the source, which
  # reads as a broken page rather than as missing configuration.
  #
  # Material does NOT bundle the renderer: it injects
  # `https://unpkg.com/mermaid@11/dist/mermaid.min.js` at page load. So a diagram in
  # `docs/` needs the reader to reach unpkg, and on a host without outbound internet the
  # block renders empty rather than falling back to its source. The same diagram in
  # README.md is unaffected -- GitHub renders mermaid server-side.
  #
  # Vendoring it (3.4 MB via `extra_javascript`) would make `/docs` self-contained and
  # keep a reader's IP off a third party, which is the arrangement this project chose for
  # its webfonts. Not done here because it is a permanent 3.4 MB in git history and that
  # is a decision worth making deliberately. See docs/troubleshooting.md.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
